<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Pay your invoice | Polymath Learning Centre</title>
<meta name="description" content="Your Polymath Learning Centre invoice with a PayNow QR code. The amount and reference are filled in for you — save the QR and scan it in your banking app.">
<link rel="icon" href="../assets/branding/polymath-learning-centre.png">
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<!-- The invoice itself is asked for straight away over Firestore's plain REST address
     (a few hundred bytes, no Firebase library): the token in the link is the key. -->
<script>
  (function () {
    try {
      var t = new URLSearchParams(location.search).get('i') || '';
      if (/^[A-Za-z0-9]{20,64}$/.test(t)) {
        window.__payEarly = fetch('https://firestore.googleapis.com/v1/projects/mathgen--app/databases/(default)/documents/officeLinks/' + t, { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : { status: r.status }; }).catch(function () { return null; });
      }
    } catch (e) { /* the page asks again */ }
  })();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root { --ink:#10303a; --ink-2:#3d5a61; --muted:#6b7f85; --teal:#2e9ca6; --deep:#056c76; --aqua:#56c4d0; --pink:#ec008c; --paper:#f2f9fa; --line:#d1eaee; --green:#15803d; --amber:#b45309; --red:#c81e1e; }
  body { font-family:'DM Sans',system-ui,-apple-system,sans-serif; background:var(--paper); color:var(--ink); line-height:1.55; -webkit-font-smoothing:antialiased; }
  h1, h2, .big { font-family:'Plus Jakarta Sans','DM Sans',sans-serif; }
  .top { background:#10303a; color:#fff; }
  .top-in { max-width:560px; margin:0 auto; padding:16px 18px; display:flex; align-items:center; gap:12px; }
  .top img { width:40px; height:40px; object-fit:contain; background:#fff; border-radius:10px; padding:3px; }
  .top b { display:block; font-size:16px; letter-spacing:.03em; }
  .top span { font-size:12.5px; color:#b8e4e8; }
  .bar { height:5px; background:linear-gradient(90deg,#2e9ca6,#56c4d0,#ec008c); }
  .wrap { max-width:560px; margin:0 auto; padding:20px 16px 60px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:20px; padding:22px 20px; box-shadow:0 2px 10px rgba(16,48,58,.06); }
  .card + .card { margin-top:16px; }
  .status { display:flex; gap:12px; align-items:center; padding:14px 16px; border-radius:14px; margin-bottom:16px; font-size:14.5px; border:1px solid; }
  .status .i { font-size:24px; }
  .status.due { background:#fffbeb; border-color:#fde68a; color:#78350f; }
  .status.late { background:#fef2f2; border-color:#fecaca; color:#7f1d1d; }
  .status.paid { background:#ecfdf3; border-color:#bbf7d0; color:#14532d; }
  .status.void { background:#f4f5f5; border-color:#e1e4e5; color:#525252; }
  .what { font-size:13px; font-weight:700; color:var(--deep); text-transform:uppercase; letter-spacing:.07em; text-align:center; }
  .amount { text-align:center; font-size:40px; font-weight:800; margin:2px 0 4px; font-variant-numeric:tabular-nums; }
  .for { text-align:center; color:var(--muted); font-size:14px; }
  .qr { display:flex; justify-content:center; margin:18px 0 6px; }
  .qr .q { background:#fff; padding:12px; border-radius:14px; border:1px solid var(--line); }
  .qr img, .qr canvas { display:block; width:240px !important; height:240px !important; }
  .filled { text-align:center; font-size:13.5px; color:var(--ink-2); margin-top:8px; }
  .btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; border:none; border-radius:14px; padding:16px; font-size:17px; font-weight:700; cursor:pointer; text-decoration:none; font-family:inherit; }
  .btn.main { background:var(--deep); color:#fff; margin-top:18px; box-shadow:0 6px 18px rgba(5,108,118,.25); }
  .btn.main:active { transform:translateY(1px); }
  .btn.main.pulse { animation:pulse 1.4s ease-in-out 4; }
  @keyframes pulse { 50% { box-shadow:0 0 0 10px rgba(46,156,166,.25); } }
  .btn.wa { background:#1fa855; color:#fff; font-size:15px; padding:13px; }
  .rows { margin-top:16px; border-top:1px solid #e7eef0; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 2px; border-bottom:1px solid #e7eef0; font-size:14.5px; }
  .row span { color:var(--muted); }
  .row b { text-align:right; word-break:break-all; }
  .row button { flex:0 0 auto; border:1px solid var(--line); background:#fff; border-radius:9px; padding:5px 10px; font-size:12.5px; font-weight:700; color:var(--deep); cursor:pointer; font-family:inherit; }
  .steps { counter-reset:s; list-style:none; display:grid; gap:12px; }
  .steps li { counter-increment:s; display:flex; gap:12px; align-items:flex-start; font-size:14.5px; }
  .steps li::before { content:counter(s); flex:0 0 28px; height:28px; border-radius:50%; background:#eaf6f7; color:var(--deep); font-weight:800; display:grid; place-items:center; font-size:14px; }
  h2 { font-size:17px; margin-bottom:12px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td { padding:10px 2px; border-bottom:1px solid #e7eef0; vertical-align:top; }
  td.r { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  td small { color:var(--muted); display:block; font-size:12.5px; }
  tr.total td { border-bottom:none; font-weight:800; font-size:16px; color:var(--deep); }
  .msg { text-align:center; padding:40px 10px; color:var(--muted); }
  .msg .big { font-size:44px; margin-bottom:8px; }
  .msg b { display:block; color:var(--ink); font-size:18px; margin-bottom:6px; }
  .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(16px); background:var(--ink); color:#fff; padding:11px 16px; border-radius:12px; font-size:14px; font-weight:600; opacity:0; transition:all .2s; pointer-events:none; max-width:92vw; }
  .toast.show { opacity:1; transform:translateX(-50%); }
  .foot { text-align:center; font-size:12.5px; color:var(--muted); margin-top:22px; }
  .foot a { color:var(--deep); }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header class="top"><div class="top-in"><img src="../assets/branding/polymath-learning-centre.png" alt=""><div><b>POLYMATH LEARNING CENTRE</b><span>Invoice &amp; PayNow</span></div></div></header>
<div class="bar"></div>
<main class="wrap" id="main"><div class="card msg"><div class="big">⏳</div><b>Opening your invoice…</b></div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module">
import * as C from '../office/office-core.mjs?v=1.0.0';

const PAY_PAGE_VERSION = 'v1.0.0';
const $ = id => document.getElementById(id);
const esc = C.escapeHtml;
const params = new URLSearchParams(location.search);
const token = params.get('i') || '';
const wantSave = params.get('save') === '1';
const TOUCH = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
let inv = null;

// Firestore's REST shape → plain values.
function fromFs(v) {
  if (!v || typeof v !== 'object') return null;
  if ('stringValue' in v) return v.stringValue;
  if ('integerValue' in v) return Number(v.integerValue);
  if ('doubleValue' in v) return Number(v.doubleValue);
  if ('booleanValue' in v) return v.booleanValue;
  if ('nullValue' in v) return null;
  if ('timestampValue' in v) return v.timestampValue;
  if ('arrayValue' in v) return (v.arrayValue.values || []).map(fromFs);
  if ('mapValue' in v) { const o = {}; Object.entries(v.mapValue.fields || {}).forEach(([k, x]) => { o[k] = fromFs(x); }); return o; }
  return null;
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2600); }
async function copy(text, label) {
  try { await navigator.clipboard.writeText(text); toast(label + ' copied'); } catch (e) { window.prompt('Copy:', text); }
}
function message(icon, title, text) {
  $('main').innerHTML = '<div class="card msg"><div class="big">' + icon + '</div><b>' + esc(title) + '</b><p>' + text + '</p></div>'
    + '<p class="foot">Questions? <a href="https://wa.me/' + C.CENTRE_WHATSAPP + '">WhatsApp us on ' + esc(C.displayPhone(C.CENTRE_WHATSAPP)) + '</a></p>';
}

async function load() {
  if (!/^[A-Za-z0-9]{20,64}$/.test(token)) { message('🔗', 'This link is not complete', 'Please open the link exactly as it was sent to you, or WhatsApp us and we will send it again.'); return; }
  let json = window.__payEarly ? await window.__payEarly : null;
  if (!json || !json.fields) {
    try {
      const r = await fetch('https://firestore.googleapis.com/v1/projects/mathgen--app/databases/(default)/documents/officeLinks/' + token, { cache: 'no-store' });
      json = r.ok ? await r.json() : { status: r.status };
    } catch (e) { json = null; }
  }
  if (!json) { message('📶', 'No connection', 'We could not reach the invoice. Check your internet connection and refresh the page.'); return; }
  if (!json.fields) { message('🔎', 'Invoice not found', 'This invoice may have been replaced. Please WhatsApp us and we will send the latest one.'); return; }
  const d = {}; Object.entries(json.fields).forEach(([k, v]) => { d[k] = fromFs(v); });
  inv = d;
  draw();
}

function draw() {
  const owe = C.round2(inv.outstanding);
  const paid = inv.status === 'paid' || !(owe > 0);
  const voided = inv.status === 'void';
  const late = !paid && !voided && C.isDayKey(inv.dueDate) && C.sgDayKey() > inv.dueDate;
  const payload = !paid && !voided ? C.buildPayNow(owe, inv.reference, { uen: inv.uen, merchant: inv.merchant }) : '';
  const status = voided ? '<div class="status void"><span class="i">✕</span><div>This invoice was cancelled. Nothing needs to be paid on it.</div></div>'
    : paid ? '<div class="status paid"><span class="i">✅</span><div><b>Paid — thank you!</b><br>We have received ' + C.money(inv.paid || inv.total) + ' for ' + esc(inv.periodLabel || C.periodLabel(inv.period)) + '.</div></div>'
      : late ? '<div class="status late"><span class="i">⚠️</span><div>This was due on <b>' + esc(C.prettyDate(inv.dueDate)) + '</b>. If you have just paid, thank you — it can take a day to show here.</div></div>'
        : '<div class="status due"><span class="i">📅</span><div>Please pay by <b>' + esc(C.prettyDate(inv.dueDate)) + '</b>.</div></div>';
  const lines = (inv.lines || []).map(l => '<tr><td>' + (l.studentName ? '<b>' + esc(l.studentName) + '</b> · ' : '') + esc(l.desc) + (l.detail ? '<small>' + esc(l.detail) + '</small>' : '') + '</td><td class="r"' + (l.amount < 0 ? ' style="color:#15803d"' : '') + '>' + C.money(l.amount) + '</td></tr>').join('');
  $('main').innerHTML = status
    + (payload ? '<div class="card"><div class="what">PayNow · ' + esc(inv.periodLabel || C.periodLabel(inv.period)) + ' fees</div>'
      + '<div class="amount">' + C.money(owe) + '</div><div class="for">for ' + esc(inv.parentName || '') + '</div>'
      + '<div class="qr"><div class="q" id="qr"></div></div>'
      + '<div class="filled">The amount and the reference are already filled in.</div>'
      + '<button class="btn main' + (wantSave ? ' pulse' : '') + '" id="save">⬇&nbsp; Save the QR to my phone</button>'
      + '<div class="rows">'
      + '<div class="row"><span>Pay to</span><b>' + esc(inv.merchant || C.MERCHANT_NAME) + '</b></div>'
      + '<div class="row"><span>UEN</span><b>' + esc(inv.uen) + '</b><button data-copy="' + esc(inv.uen) + '" data-label="UEN">Copy</button></div>'
      + '<div class="row"><span>Amount</span><b>' + C.money(owe) + '</b><button data-copy="' + C.moneyPlain(owe) + '" data-label="Amount">Copy</button></div>'
      + '<div class="row"><span>Reference</span><b>' + esc(inv.reference) + '</b><button data-copy="' + esc(inv.reference) + '" data-label="Reference">Copy</button></div>'
      + '</div></div>'
      + '<div class="card"><h2>How to pay</h2><ol class="steps">'
      + (TOUCH ? '<li><span>Tap <b>Save the QR to my phone</b> above (choose <b>Save image</b>).</span></li><li><span>Open your banking app → <b>Scan QR</b> → choose the picture from your <b>gallery / photos</b>.</span></li>'
        : '<li><span>Open your banking app on your phone and choose <b>Scan QR</b>.</span></li><li><span>Point it at the QR on this screen — or save the QR and scan it from your gallery.</span></li>')
      + '<li><span>Check the amount is <b>' + C.money(owe) + '</b> and the reference is <b>' + esc(inv.reference) + '</b>, then pay. That is all — the reference tells us it is from you.</span></li></ol></div>' : '')
    + '<div class="card"><h2>Invoice ' + esc(inv.number || '') + '</h2><table><tbody>' + lines
    + '<tr class="total"><td>Total</td><td class="r">' + C.money(inv.total) + '</td></tr>'
    + (inv.paid > 0 && !paid ? '<tr><td>Received</td><td class="r" style="color:#15803d">' + C.money(inv.paid) + '</td></tr><tr><td><b>Still to pay</b></td><td class="r"><b>' + C.money(owe) + '</b></td></tr>' : '')
    + '</tbody></table>' + (inv.issueDate ? '<p class="foot" style="text-align:left;margin-top:10px;">Issued ' + esc(C.prettyDate(inv.issueDate)) + '</p>' : '') + '</div>'
    + (inv.note ? '<div class="card"><p>' + esc(inv.note) + '</p></div>' : '')
    + '<div class="card"><a class="btn wa" href="https://wa.me/' + esc(inv.centreWhatsapp || C.CENTRE_WHATSAPP) + '?text=' + encodeURIComponent('Hi Polymath, about invoice ' + (inv.number || '') + ' (' + (inv.reference || '') + ')') + '">💬 Questions? WhatsApp us</a></div>'
    + '<p class="foot">Polymath Learning Centre · <a href="https://polymathlc.com.sg/">polymathlc.com.sg</a> · ' + PAY_PAGE_VERSION + '</p>';
  if (payload) {
    new QRCode($('qr'), { text: payload, width: 240, height: 240, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
    $('save').addEventListener('click', () => saveQr(payload, owe));
    if (wantSave) setTimeout(() => { $('save').scrollIntoView({ behavior: 'smooth', block: 'center' }); if (!TOUCH) saveQr(payload, owe); }, 500);
  }
  document.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', () => copy(b.dataset.copy, b.dataset.label)));
}

// The picture saved to the phone: amount, QR, reference — the same card the
// products page saves, so a parent who has paid for a book knows it already.
function qrCanvas(payload, size) {
  return new Promise((resolve, reject) => {
    const holder = document.createElement('div');
    holder.style.cssText = 'position:fixed;left:-9999px;top:0;';
    document.body.appendChild(holder);
    new QRCode(holder, { text: payload, width: size, height: size, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
    const finish = () => {
      const c = holder.querySelector('canvas'), img = holder.querySelector('img');
      if (c) { holder.remove(); resolve(c); return; }
      if (img && img.complete && img.naturalWidth) { const cv = document.createElement('canvas'); cv.width = cv.height = size; cv.getContext('2d').drawImage(img, 0, 0, size, size); holder.remove(); resolve(cv); return; }
      if (img) { img.onload = finish; return; }
      holder.remove(); reject(new Error('QR'));
    };
    setTimeout(finish, 30);
  });
}
async function cardImage(payload, owe) {
  const W = 720, P = 48, QR = 420, BOX = 470;
  const rows = [['Pay to', inv.merchant || C.MERCHANT_NAME], ['UEN', inv.uen], ['Amount', C.money(owe)], ['Reference', inv.reference]];
  const H = 110 + 120 + BOX + 40 + rows.length * 44 + 100;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const font = (w, s) => w + ' ' + s + 'px "DM Sans","Plus Jakarta Sans",Arial,sans-serif';
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#10303a'; ctx.fillRect(0, 0, W, 110);
  const g = ctx.createLinearGradient(0, 0, W, 0); g.addColorStop(0, '#2e9ca6'); g.addColorStop(.5, '#56c4d0'); g.addColorStop(1, '#ec008c');
  ctx.fillStyle = g; ctx.fillRect(0, 104, W, 6);
  ctx.fillStyle = '#fff'; ctx.font = font('bold', 26); ctx.fillText('POLYMATH LEARNING CENTRE', P, 50);
  ctx.fillStyle = '#b8e4e8'; ctx.font = font('500', 20); ctx.fillText('PayNow · ' + (inv.periodLabel || C.periodLabel(inv.period)) + ' fees', P, 82);
  ctx.fillStyle = '#056c76'; ctx.font = font('bold', 58); ctx.fillText(C.money(owe), P, 196);
  let y = 230; const bx = (W - BOX) / 2;
  ctx.strokeStyle = '#d1eaee'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bx, y, BOX, BOX, 18) : ctx.rect(bx, y, BOX, BOX); ctx.stroke();
  const qr = await qrCanvas(payload, QR);
  ctx.drawImage(qr, bx + (BOX - QR) / 2, y + (BOX - QR) / 2, QR, QR);
  y += BOX + 44;
  rows.forEach(([k, v]) => {
    ctx.textAlign = 'left'; ctx.fillStyle = '#737373'; ctx.font = font('500', 20); ctx.fillText(k, P, y);
    ctx.textAlign = 'right'; ctx.fillStyle = '#10303a'; ctx.font = font('bold', 22); ctx.fillText(v, W - P, y);
    ctx.strokeStyle = '#eef3f4'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(P, y + 16); ctx.lineTo(W - P, y + 16); ctx.stroke();
    y += 44;
  });
  ctx.textAlign = 'center'; ctx.fillStyle = '#525252'; ctx.font = font('500', 18);
  ctx.fillText('Open your banking app → Scan QR → choose this picture', W / 2, y + 34);
  return cv;
}
async function saveQr(payload, owe) {
  const btn = $('save');
  btn.disabled = true;
  try {
    const cv = await cardImage(payload, owe);
    const name = C.qrFileName(inv.reference);
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    const file = new File([blob], name, { type: 'image/png' });
    if (TOUCH && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'PayNow QR' }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast(TOUCH ? 'Saved — now open your banking app' : 'QR saved to your Downloads');
  } catch (e) { toast('Could not save — take a screenshot instead'); } finally { btn.disabled = false; }
}
load();
</script>
</body>
</html>
