  @font-face { font-family: 'OfflineQuestion'; src: local('Roboto'), local('Roboto-Regular'), local('Arial'), local('Helvetica'); unicode-range: U+003F; }

  html, body { height: 100%; margin: 0; }

    border: 1px solid var(--line);

  h1 { font-size: 1.35rem; margin: 18px 0 6px; letter-spacing: 0.01em; }
  p { color: var(--muted); margin: 0 0 22px; }
  button {
    font: inherit;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 10px;
