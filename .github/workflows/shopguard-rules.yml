name: Shop Guard rules

# Makes Shop Guard's data private in the SHARED rules of mathgen--app:
#   Firestore  shopguard/**  (settings with the Telegram token, alerts, clip records)
#   Storage    shopguard/**  (the shop's CCTV clips and alert pictures)
# Both tools only add their own block and one predicate on the catch-all; every
# other app keeps exactly the permissions it has today, and each refuses rules it
# does not recognise. polymathlc.com.sg/shopguard will not record or save
# settings until a signed-out read of both is refused.
#
#   pull request        offline checks only
#   push to main        offline checks, then a dry run against the LIVE rules (nothing changes)
#   Run workflow        the same, and with "apply" ticked it publishes both
#
# Needs the FIREBASE_SERVICE_ACCOUNT repository secret (also used by the Office,
# enquiry, Online and /cs rules).

on:
  pull_request:
    paths: ['tools/shopguard-*', 'shopguard/**', '.github/workflows/shopguard-rules.yml']
  push:
    branches: [main]
    paths: ['tools/shopguard-*', 'shopguard/**', '.github/workflows/shopguard-rules.yml']
  workflow_dispatch:
    inputs:
      apply:
        description: 'Publish the Shop Guard protection to the shared Firestore and Storage rules'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline checks (both rules tools and the page)
        run: |
          node --check tools/shopguard-rules.mjs
          node --check tools/shopguard-storage-rules.mjs
          node --test tools/shopguard-rules-tests.mjs

  firestore:
    needs: offline
    if: github.repository == 'polymathlc/cer' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: polymath-shared-rules
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare the service-account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tools/shopguard-rules.mjs --setup
      - name: Install the Firebase CLI
        run: npm install -g firebase-tools --no-audit --no-fund
      - name: Test every permission against the live Firestore rules, or publish when asked
        env:
          APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply && '--apply' || '' }}
        run: |
          set -euo pipefail
          if ! out=$(node tools/shopguard-rules.mjs --firebase-tools "$(npm root -g)/firebase-tools" $APPLY 2>"$RUNNER_TEMP/sg-fs.err"); then
            cat "$RUNNER_TEMP/sg-fs.err"
            echo "::error title=Shop Guard Firestore rules::$(tail -2 "$RUNNER_TEMP/sg-fs.err" | tr '\n' ' ' | cut -c1-3500)"
            exit 1
          fi
          echo "$out"
          summary=$(jq -c '{mode, changed, changeNeeded, validated}' <<<"$out")
          echo "::notice title=Shop Guard Firestore rules::$summary"
          echo "Firestore: $summary" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json" "$RUNNER_TEMP/sg-fs.err"

  storage:
    needs: offline
    if: github.repository == 'polymathlc/cer' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: polymath-shared-storage-rules
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare the service-account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tools/shopguard-rules.mjs --setup
      - name: Install the Firebase CLI
        run: npm install -g firebase-tools --no-audit --no-fund
      - name: Dry run against the live Storage rules, or publish when asked
        env:
          APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply && '--apply' || '' }}
        run: |
          set -euo pipefail
          if ! out=$(node tools/shopguard-storage-rules.mjs --firebase-tools "$(npm root -g)/firebase-tools" $APPLY 2>"$RUNNER_TEMP/sg-st.err"); then
            cat "$RUNNER_TEMP/sg-st.err"
            echo "::error title=Shop Guard Storage rules::$(tail -2 "$RUNNER_TEMP/sg-st.err" | tr '\n' ' ' | cut -c1-3500)"
            exit 1
          fi
          echo "$out"
          summary=$(jq -c '{mode, installed, changeNeeded, changed, holds, predicate, probes, allowedToday, tried}' <<<"$out")
          echo "::notice title=Shop Guard Storage rules::$summary"
          echo "Storage: $summary" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json" "$RUNNER_TEMP/sg-st.err"
