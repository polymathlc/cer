name: Admin games insights and real launch tracking
on:
  pull_request:
    paths: ['game-insights*', 'game-usage.js', 'app.js', 'index.html', 'fps.html', 'science-*.html', 'hades-*', 'pirate-rift*', 'grand-line*', 'tools/game-insights*', 'tools/game-usage*', '.github/workflows/game-insights.yml']
  push:
    branches: [main]
    paths: ['game-insights*', 'game-usage.js', 'app.js', 'index.html', 'fps.html', 'science-*.html', 'hades-*', 'pirate-rift*', 'grand-line*', 'tools/game-insights*', 'tools/game-usage*', '.github/workflows/game-insights.yml']
permissions:
  contents: read
jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Verify private statistics, canonical starts and merge-only telemetry
        run: node --test tools/game-insights-tests.mjs tools/game-usage-tests.mjs
      - name: Install isolated browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/insights-browser" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/insights-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify admin access, real starts, source identity and dashboard coverage
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/insights-browser/node_modules/playwright/index.mjs
          GAME_SCREENSHOTS: ${{ runner.temp }}/game-insights-qa
        run: |
          node tools/game-insights-browser.mjs
          node tools/game-usage-browser.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: game-insights-qa
          path: ${{ runner.temp }}/game-insights-qa
          if-no-files-found: ignore
          retention-days: 7
