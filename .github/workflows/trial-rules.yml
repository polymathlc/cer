name: Trial page rules

# Makes the /trial page's data private in the SHARED Firestore rules of mathgen--app:
#   trialSettings/**  trialBookings/**  trialCodes/**  trialLinks/**
# (the password hash, Zoom links, parents' bookings, one-time codes and class
# links). No browser may read or write them; only the trial functions can.
# tools/trial-rules.mjs only adds its own block and one predicate on the
# catch-all; every other app keeps exactly the permissions it has today, and it
# refuses rules it does not recognise.
#
#   pull request        offline checks only
#   push to main        offline checks, then a dry run against the LIVE rules (nothing changes)
#   Run workflow        the same, and with "apply" ticked it publishes the protection
#
# Needs the FIREBASE_SERVICE_ACCOUNT repository secret (also used by the Office,
# enquiry, Online, Shop Guard and /cs rules).

on:
  pull_request:
    paths: ['tools/trial-*', 'trial/**', 'shop-function/functions/trial*.js', '.github/workflows/trial-rules.yml']
  push:
    branches: [main]
    paths: ['tools/trial-*', 'trial/**', 'shop-function/functions/trial*.js', '.github/workflows/trial-rules.yml']
  workflow_dispatch:
    inputs:
      apply:
        description: 'Publish the trial page protection to the shared Firestore rules'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline checks (rules tool, reminders and the page)
        run: |
          node --check tools/trial-rules.mjs
          node --check tools/trial-reminders.mjs
          node --test tools/trial-tests.mjs

  firestore:
    needs: offline
    if: github.repository == 'polymathlc/cer' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: polymath-shared-rules
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare the service-account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tools/trial-rules.mjs --setup
      - name: Install the Firebase CLI
        run: npm install -g firebase-tools --no-audit --no-fund
      - name: Test every permission against the live Firestore rules, or publish when asked
        env:
          APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply && '--apply' || '' }}
        run: |
          set -euo pipefail
          if ! out=$(node tools/trial-rules.mjs --firebase-tools "$(npm root -g)/firebase-tools" $APPLY 2>"$RUNNER_TEMP/trial-fs.err"); then
            cat "$RUNNER_TEMP/trial-fs.err"
            echo "::error title=Trial Firestore rules::$(tail -2 "$RUNNER_TEMP/trial-fs.err" | tr '\n' ' ' | cut -c1-3500)"
            exit 1
          fi
          echo "$out"
          summary=$(jq -c '{mode, changed, changeNeeded, validated}' <<<"$out")
          echo "::notice title=Trial Firestore rules::$summary"
          echo "Firestore: $summary" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json" "$RUNNER_TEMP/trial-fs.err"
