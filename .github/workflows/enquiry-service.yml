name: Public enquiry service
on:
  pull_request:
    paths: ['enquiry-function/**', 'tools/enquiry-rules.mjs', 'tools/enquiry-rules-tests.mjs', '.github/workflows/enquiry-service.yml']
  push:
    branches: [main]
    paths: ['enquiry-function/**', 'tools/enquiry-rules.mjs', 'tools/enquiry-rules-tests.mjs', '.github/workflows/enquiry-service.yml']
permissions:
  contents: read
jobs:
  enquiry-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: enquiry-function/functions/package-lock.json
      - run: npm ci --prefix enquiry-function/functions
      - run: npm test --prefix enquiry-function/functions
      - run: node --test tools/enquiry-rules-tests.mjs
      - run: node --check enquiry-function/functions/index.js
