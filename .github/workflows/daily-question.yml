name: Question of the Day emails

# ❓ The Free Question of the Day (polymathlc.com.sg/question) — tools/daily-question-send.mjs.
#
# Every morning at about 6:07 a.m. Singapore time it emails each confirmed daily
# subscriber today's question(s) with yesterday's worked answer(s); on Saturdays
# weekly subscribers get the past week's questions with answers. Two later runs
# (about 7:37 and 9:07 a.m.) catch a scheduled run that GitHub started late or
# skipped. Every email has a once-only id per subscriber per day, so nobody is
# ever sent the same email twice.
#
# No Cloud Scheduler and no deploy: the deploy service account cannot create
# scheduler jobs, so the schedule lives here. Pause the emails, or change the
# daily cap, at polymathlc.com.sg/question/#admin.
#
# Run workflow by hand: "dry-run" builds every email from the real data and sends
# nothing; "check" only counts; "send" sends now (it still never sends twice).
# This repository is public: the log shows counts only.

on:
  schedule:
    - cron: '7 22 * * *'
    - cron: '37 23 * * *'
    - cron: '7 1 * * *'
  workflow_dispatch:
    inputs:
      what:
        description: 'What to do'
        type: choice
        default: dry-run
        options: [dry-run, check, send]
  push:
    branches: [main]
    paths: ['shop-function/functions/daily-question*', 'tools/daily-question*', 'question/**', '.github/workflows/daily-question.yml']
  pull_request:
    paths: ['shop-function/functions/daily-question*', 'tools/daily-question*', 'question/**', 'question-of-the-day.js', '.github/workflows/daily-question.yml']

permissions:
  contents: read

concurrency:
  group: polymath-question-of-the-day-${{ github.event_name == 'pull_request' && github.ref || 'live' }}
  cancel-in-progress: false

jobs:
  tests:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Question of the Day tests
        run: |
          node --check tools/daily-question-send.mjs
          node --check question-of-the-day.js
          node --check question/question-app.js
          node --test tools/daily-question-tests.mjs
          node --test shop-function/functions/test/daily-question.test.js

  send:
    if: github.repository == 'polymathlc/cer' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the questions and the emails first
        run: node --test tools/daily-question-tests.mjs

      - name: Install the Admin SDK
        run: npm install --prefix "$RUNNER_TEMP/office-deps" --no-save --no-audit --no-fund firebase-admin@12

      - name: Prepare the service-account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tools/office-rules.mjs --setup

      - name: Question of the Day
        env:
          OFFICE_DEPS: ${{ runner.temp }}/office-deps
          WHAT: ${{ github.event_name == 'workflow_dispatch' && inputs.what || 'scheduled' }}
        run: |
          case "$WHAT" in
            dry-run) node tools/daily-question-send.mjs --dry-run --force ;;
            check) node tools/daily-question-send.mjs --check --force ;;
            send) node tools/daily-question-send.mjs ;;
            *) node tools/daily-question-send.mjs ;;
          esac

      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
