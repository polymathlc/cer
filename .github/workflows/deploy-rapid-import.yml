name: Deploy Rapid Add worker

# Deploy only the CER worker codebase. Shared Maths functions and live
# Firestore/Storage rules are deliberately outside this workflow's scope.
on:
  push:
    branches: [main]
    paths:
      - 'rapid-import/**'
      - '.github/workflows/deploy-rapid-import.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-cer-rapid-import
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'polymathlc/cer' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_PROJECT: mathgen--app
      RAPID_REGION: us-central1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rapid-import/functions/package-lock.json

      - name: Test the durable worker
        run: |
          npm ci --prefix rapid-import/functions --no-audit --no-fund
          npm test --prefix rapid-import/functions

      - name: Prepare the existing deployment credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync, appendFileSync} from 'node:fs';
          import {join} from 'node:path';
          const raw = process.env.FIREBASE_SERVICE_ACCOUNT;
          if (!raw) {
            console.error('::error::Missing FIREBASE_SERVICE_ACCOUNT repository secret. The worker has not been deployed.');
            process.exit(1);
          }
          let key;
          try { key = JSON.parse(raw); } catch {
            console.error('::error::The deployment credential must be a service-account JSON key.');
            process.exit(1);
          }
          if (key.type !== 'service_account' || key.project_id !== process.env.FIREBASE_PROJECT || !key.client_email || !key.private_key) {
            console.error('::error::Expected a service-account deployment credential for mathgen--app.');
            process.exit(1);
          }
          const path = join(process.env.RUNNER_TEMP, 'rapid-import-sa.json');
          writeFileSync(path, raw, {mode:0o600});
          appendFileSync(process.env.GITHUB_ENV, 'GOOGLE_APPLICATION_CREDENTIALS=' + path + '\n');
          JS

      - name: Install the Firebase CLI
        run: npm install -g firebase-tools@15.29.0 --no-audit --no-fund

      - name: Deploy the isolated worker
        run: firebase deploy --project "$FIREBASE_PROJECT" --config rapid-import/firebase.json --only functions:cer-rapid-import --non-interactive --force

      - uses: google-github-actions/setup-gcloud@v2

      - name: Enable the optional existing Kimi backup on the worker identities
        run: |
          set -euo pipefail
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --project="$FIREBASE_PROJECT" --quiet
          if gcloud secrets versions describe latest --secret=MOONSHOT_API_KEY --project="$FIREBASE_PROJECT" --format='value(state)' 2>/dev/null | grep -qx ENABLED; then
            for function in rapidImportPage rapidVettingImage; do
              if ! identity=$(gcloud functions describe "$function" --gen2 --region="$RAPID_REGION" --project="$FIREBASE_PROJECT" --format='value(serviceConfig.serviceAccountEmail)' 2>/dev/null); then
                echo "::warning::Cannot read $function runtime identity. Its optional Kimi backup was not verified."
                continue
              fi
              if [[ "$identity" != *@*.gserviceaccount.com ]]; then
                echo "::warning::Cannot determine $function runtime identity. Its optional Kimi backup was not verified."
                continue
              fi
              if ! gcloud secrets add-iam-policy-binding MOONSHOT_API_KEY --project="$FIREBASE_PROJECT" --member="serviceAccount:$identity" --role=roles/secretmanager.secretAccessor --quiet >/dev/null 2>&1; then
                echo "::warning::Could not grant $function access to the existing optional backup secret. OpenAI/Gemini deployment succeeded; Kimi access needs verification."
              fi
            done
          else
            echo '::warning::No enabled shared MOONSHOT_API_KEY secret is visible. OpenAI/Gemini remain available; Kimi is optional.'
          fi

      - name: Verify the deployed status and Decisions review authentication gates
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/rapid-import-probe.json"
          for callable in rapidImportStatus cerDecisionsReview; do
            status=$(curl --silent --show-error --max-time 60 --output "$probe" --write-out '%{http_code}' --header 'Content-Type: application/json' --data '{"data":{}}' "https://$RAPID_REGION-$FIREBASE_PROJECT.cloudfunctions.net/$callable")
            [[ "$status" == 401 ]]
            node --input-type=module - "$probe" <<'JS'
          import {readFileSync} from 'node:fs';
          if (JSON.parse(readFileSync(process.argv[2], 'utf8')).error?.status !== 'UNAUTHENTICATED') {
            throw new Error('The deployed callable did not enforce the expected sign-in requirement.');
          }
          JS
          done
          echo 'CER Rapid Add worker redeployed. Status and Decisions review authentication gates verified; this check does not submit PDFs or call AI providers. OpenAI Decisions availability is unverified until an authenticated review succeeds.' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the deployment credential
        if: always()
        run: rm -f "$RUNNER_TEMP/rapid-import-sa.json" "$RUNNER_TEMP/rapid-import-probe.json"
