name: Private data rules (signed-out lock)

# Closes the private collections of the SHARED Firestore rules of mathgen--app
# to any browser that is not signed in — every account's users/** subtree, the
# rosters (userProfiles, studentProfiles) and the CER portal's answers, logins,
# messages, community posts, prize claims, work sessions, flags, boards and
# quests, plus (v2) Rewards, Study Buddy, Scan and Math data, with bookings and
# holiday registrations create-only. A signed-in account (including an anonymous sign-in) keeps exactly the
# access it has today. tools/private-data-rules.mjs only adds its own block and
# one predicate on the catch-all; every other app keeps its permissions, and it
# refuses rules it does not recognise.
#
#   pull request        offline checks only
#   push to main        offline checks, then every permission case is tested
#                       against the LIVE rules through the Rules API (nothing changes)
#                       and a stranger's view is reported (read only)
#   Run workflow        the same; "apply" publishes the lock, "undo" takes it out
#
# Needs the FIREBASE_SERVICE_ACCOUNT repository secret (also used by the Office,
# enquiry, Online, Shop Guard, /cs and trial rules).

on:
  pull_request:
    paths: ['tools/private-data-rules*', 'tools/signed-out-lock-core.mjs', 'tools/*rules*.mjs', '.github/workflows/private-data-rules.yml']
  push:
    branches: [main]
    paths: ['tools/private-data-rules*', 'tools/signed-out-lock-core.mjs', '.github/workflows/private-data-rules.yml']
  workflow_dispatch:
    inputs:
      apply:
        description: 'Publish the signed-out lock to the shared Firestore rules'
        type: boolean
        default: false
      undo:
        description: 'Take the signed-out lock out of the shared Firestore rules again'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline checks (this tool and every rules tool it adjusts)
        run: |
          node --check tools/signed-out-lock-core.mjs
          node --check tools/private-data-rules.mjs
          node --test tools/private-data-rules-tests.mjs
          node --test tools/cs-rules-tests.mjs tools/office-rules-tests.mjs tools/online-rules-tests.mjs \
            tools/shopguard-rules-tests.mjs tools/enquiry-rules-tests.mjs tools/cer-live-server-rules-tests.mjs \
            tools/trial-tests.mjs tools/student-access-tests.mjs

  firestore:
    needs: offline
    if: github.repository == 'polymathlc/cer' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: polymath-shared-rules
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse apply and undo together
        if: github.event_name == 'workflow_dispatch' && inputs.apply && inputs.undo
        run: |
          echo "::error title=Private data rules::Tick apply OR undo, not both."
          exit 1
      - name: Prepare the service-account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tools/private-data-rules.mjs --setup
      - name: Install the Firebase CLI
        run: npm install -g firebase-tools --no-audit --no-fund
      - name: Test every permission against the live Firestore rules, or publish when asked
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.apply && '--apply' || github.event_name == 'workflow_dispatch' && inputs.undo && '--undo' || '' }}
        run: |
          set -euo pipefail
          if ! out=$(node tools/private-data-rules.mjs --firebase-tools "$(npm root -g)/firebase-tools" $MODE 2>"$RUNNER_TEMP/private-data.err"); then
            cat "$RUNNER_TEMP/private-data.err"
            echo "::error title=Private data rules::$(tail -2 "$RUNNER_TEMP/private-data.err" | tr '\n' ' ' | cut -c1-3500)"
            exit 1
          fi
          echo "$out"
          summary=$(jq -c '{mode, installed, changed, changeNeeded, validated, previousRuleset, ruleset}' <<<"$out")
          echo "::notice title=Private data rules::$summary"
          echo "Firestore: $summary" >> "$GITHUB_STEP_SUMMARY"
      - name: What a stranger sees now (read only, no key)
        env:
          EXPECT_LOCKED: ${{ github.event_name == 'workflow_dispatch' && inputs.apply && 'true' || 'false' }}
        run: |
          set -euo pipefail
          out=$(node tools/private-data-rules.mjs --probe)
          echo "$out"
          refused=$(jq -r '.refused' <<<"$out")
          echo "Stranger refused: $refused $(jq -c '.statuses' <<<"$out")" >> "$GITHUB_STEP_SUMMARY"
          if [ "$EXPECT_LOCKED" = "true" ] && [ "$refused" != "true" ]; then
            echo "::error title=Private data rules::Published, but a signed-out read is still answered: $(jq -c '.statuses' <<<"$out")"
            exit 1
          fi
      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json" "$RUNNER_TEMP/private-data.err"
