name: Deploy the live voice bridge (Ainstein + The Polymath)

# Deploys ONLY the isolated `cer-ainstein-live` functions codebase:
# cerAinsteinLive (the administrator's Ainstein), polymathLive (The Polymath's
# voice on the answer-key QR page, v1.448.0) and the shared cleanup sweeper.
# Shared Firestore/Storage rules are NOT published here: the rules tool runs
# read-only and only reports whether the existing Live protection is in place.
on:
  push:
    branches: [main]
    paths:
      - 'live-assistant/**'
      - '.github/workflows/deploy-live-assistant.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-cer-live-assistant
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'polymathlc/cer' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_PROJECT: mathgen--app
      LIVE_REGION: us-central1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: live-assistant/functions/package-lock.json

      - name: Test the voice bridge (no paid calls)
        run: |
          npm ci --prefix live-assistant/functions --no-audit --no-fund
          npm test --prefix live-assistant/functions

      - name: Prepare the existing deployment credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync, appendFileSync} from 'node:fs';
          import {join} from 'node:path';
          const raw = process.env.FIREBASE_SERVICE_ACCOUNT;
          if (!raw) {
            console.error('::error::Missing FIREBASE_SERVICE_ACCOUNT repository secret. The voice bridge has not been deployed.');
            process.exit(1);
          }
          let key;
          try { key = JSON.parse(raw); } catch {
            console.error('::error::The deployment credential must be a service-account JSON key.');
            process.exit(1);
          }
          if (key.type !== 'service_account' || key.project_id !== process.env.FIREBASE_PROJECT || !key.client_email || !key.private_key) {
            console.error('::error::Expected a service-account deployment credential for mathgen--app.');
            process.exit(1);
          }
          const path = join(process.env.RUNNER_TEMP, 'live-assistant-sa.json');
          writeFileSync(path, raw, {mode:0o600});
          appendFileSync(process.env.GITHUB_ENV, 'GOOGLE_APPLICATION_CREDENTIALS=' + path + '\n');
          JS

      - name: Install the Firebase CLI
        run: npm install -g firebase-tools@15.29.0 --no-audit --no-fund

      - name: Check the shared Live protection (read-only, never publishes)
        continue-on-error: true
        run: |
          set -euo pipefail
          root="$(npm root -g)/firebase-tools"
          if out=$(node tools/cer-live-server-rules.mjs --firebase-tools "$root" --read 2>&1); then
            echo "$out"
            echo '✅ Shared Live protection checked (read-only).' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$out"
            echo "::warning::The shared Live rules check did not pass. Review it before relying on the lease collections' protection; nothing was published."
            echo '⚠️ Shared Live rules check did not pass — nothing was published; review manually.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy the isolated codebase
        run: firebase deploy --project "$FIREBASE_PROJECT" --config live-assistant/firebase.json --only functions:cer-ainstein-live --non-interactive --force

      - name: Verify the deployed gates (no call is started)
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/live-probe.json"
          base="https://$LIVE_REGION-$FIREBASE_PROJECT.cloudfunctions.net"
          # The Polymath refuses a foreign origin outright…
          status=$(curl --silent --show-error --max-time 60 --output "$probe" --write-out '%{http_code}' \
            --header 'Origin: https://example.com' --header 'Content-Type: application/json' \
            --data '{"action":"start","sdp":"v=0\r\nm=audio 9\r\n"}' "$base/polymathLive")
          [[ "$status" == 403 ]] || { echo "::error::polymathLive answered $status to a foreign origin"; cat "$probe"; exit 1; }
          # …and a request from its own page with no sign-in.
          status=$(curl --silent --show-error --max-time 60 --output "$probe" --write-out '%{http_code}' \
            --header 'Origin: https://polymathlc.github.io' --header 'Content-Type: application/json' \
            --data '{"action":"start","sdp":"v=0\r\nm=audio 9\r\n"}' "$base/polymathLive")
          [[ "$status" == 401 || "$status" == 400 ]] || { echo "::error::polymathLive answered $status without a sign-in"; cat "$probe"; exit 1; }
          node --input-type=module - "$probe" <<'JS'
          import {readFileSync} from 'node:fs';
          const code = JSON.parse(readFileSync(process.argv[2], 'utf8')).error?.code;
          if (!['sign_in_required', 'invalid_audio', 'invalid_request'].includes(code)) throw new Error('polymathLive did not refuse as expected: ' + code);
          JS
          echo 'Live voice bridge deployed (cerAinsteinLive, polymathLive, cerAinsteinLiveCleanup). The Polymath refuses foreign origins and unsigned requests; no paid call was started.' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the deployment credential
        if: always()
        run: rm -f "$RUNNER_TEMP/live-assistant-sa.json" "$RUNNER_TEMP/live-probe.json"
