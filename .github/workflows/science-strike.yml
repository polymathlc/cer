name: Science Strike gameplay checks
on:
  pull_request:
    paths: ['fps.html', 'science-strike*.js', 'science-feed*.js', 'tools/science-strike*.mjs', '.github/workflows/science-strike.yml']
  push:
    branches: [main]
    paths: ['fps.html', 'science-strike*.js', 'science-feed*.js', 'tools/science-strike*.mjs', '.github/workflows/science-strike.yml']
permissions:
  contents: read
jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game state and existing question safeguards
        run: node --test tools/science-strike-tests.mjs tools/science-feed-standalone-tests.mjs
      - name: Install isolated browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/strike-browser" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/strike-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Play the production game with isolated test accounts
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/strike-browser/node_modules/playwright/index.mjs
          SCIENCE_STRIKE_SCREENSHOTS: ${{ runner.temp }}/science-strike-qa
        run: node tools/science-strike-browser-tests.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: science-strike-gameplay
          path: ${{ runner.temp }}/science-strike-qa
          if-no-files-found: ignore
          retention-days: 7
