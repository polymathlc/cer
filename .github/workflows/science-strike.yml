name: Non-TCG gameplay checks
on:
  pull_request:
    paths: ['fps.html', 'science-*.html', 'app.js', 'index.html', 'science-strike*.js', 'science-feed*.js', 'rpg-*.js', 'spire-svg-art.js', 'tools/science-strike*.mjs', 'tools/game-*.mjs', 'tools/rpg-*.mjs', '.github/workflows/science-strike.yml']
  push:
    branches: [main]
    paths: ['fps.html', 'science-*.html', 'app.js', 'index.html', 'science-strike*.js', 'science-feed*.js', 'rpg-*.js', 'spire-svg-art.js', 'tools/science-strike*.mjs', 'tools/game-*.mjs', 'tools/rpg-*.mjs', '.github/workflows/science-strike.yml']
permissions:
  contents: read
jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game state and existing question safeguards
        run: node --test tools/science-strike-tests.mjs tools/science-strike-database-tests.mjs tools/science-feed-standalone-tests.mjs tools/game-*-tests.mjs tools/rpg-*-tests.mjs
      - name: Install isolated browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/strike-browser" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/strike-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Play the production games with isolated test accounts
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/strike-browser/node_modules/playwright/index.mjs
          SCIENCE_STRIKE_SCREENSHOTS: ${{ runner.temp }}/science-strike-qa/strike
          GAME_SCREENSHOTS: ${{ runner.temp }}/science-strike-qa
        run: |
          node tools/science-strike-browser-tests.mjs
          node tools/game-defenders-raiders-browser.mjs
          node tools/game-legends-slayers-browser.mjs
          node tools/game-spire-adventure-browser.mjs
          node tools/rpg-svg-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: non-tcg-gameplay
          path: ${{ runner.temp }}/science-strike-qa
          if-no-files-found: ignore
          retention-days: 7
