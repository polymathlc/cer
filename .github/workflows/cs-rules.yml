name: /cs rules

# Locks the /cs download gate's five server-only collections (csFiles,
# csLeads, csLimits, csGrants, csSettings) in the SHARED Firestore rules of
# mathgen--app, with tools/cs-rules.mjs. The tool only adds its own block and
# one predicate to the catch-all; every other app keeps its permissions, and
# it refuses rules it does not recognise.
#
#   pull request        offline checks only
#   push to main        offline checks, then every permission case is tested
#                       against the LIVE rules through the Rules API (nothing changes)
#   Run workflow        the same, and with "apply" ticked it publishes the change
on:
  pull_request:
    paths: ['tools/cs-rules*', '.github/workflows/cs-rules.yml']
  push:
    branches: [main]
    paths: ['tools/cs-rules*', '.github/workflows/cs-rules.yml']
  workflow_dispatch:
    inputs:
      apply:
        description: 'Publish the /cs protection to the shared Firestore rules'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: polymath-shared-rules
  cancel-in-progress: false

jobs:
  cs-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Offline checks
        run: |
          node --check tools/cs-rules.mjs
          node --test tools/cs-rules-tests.mjs

      - name: Prepare the service-account key
        if: github.repository == 'polymathlc/cer' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tools/cs-rules.mjs --setup

      - name: Install the Firebase CLI
        if: github.repository == 'polymathlc/cer' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npm install -g firebase-tools --no-audit --no-fund

      - name: Test every permission against the live rules (changes nothing)
        if: github.repository == 'polymathlc/cer' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.apply
        run: |
          set -euo pipefail
          if ! out=$(node tools/cs-rules.mjs --firebase-tools "$(npm root -g)/firebase-tools" 2>"$RUNNER_TEMP/cs-rules.err"); then
            cat "$RUNNER_TEMP/cs-rules.err"
            echo "::error title=/cs rules test::$(tail -3 "$RUNNER_TEMP/cs-rules.err" | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          echo "$out"
          if [ "$(jq -r '.changeNeeded' <<<"$out")" = "true" ]; then
            msg="/cs protection is NOT installed yet; all $(jq -r '.validated' <<<"$out") permission cases pass. Run this workflow with apply ticked to publish it."
          else
            msg="/cs protection is installed; all $(jq -r '.validated' <<<"$out") permission cases pass."
          fi
          echo "::notice title=/cs rules::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      - name: Ask whether Storage lets anybody round the form (read-only)
        if: github.repository == 'polymathlc/cer' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          set -euo pipefail
          if ! out=$(node tools/cs-rules.mjs --firebase-tools "$(npm root -g)/firebase-tools" --storage 2>"$RUNNER_TEMP/cs-rules.err"); then
            echo "::warning title=/cs Storage check::$(tail -3 "$RUNNER_TEMP/cs-rules.err" | tr '\n' ' ' | cut -c1-600)"
            exit 0
          fi
          echo "$out"
          summary=$(jq -c '{strangerCanRead, strangerCanList, signedInCanRead, adminCanUpload, previewsReadable}' <<<"$out")
          if [ "$(jq -r '.gateCanBeBypassed' <<<"$out")" = "true" ]; then
            echo "::warning title=/cs Storage exposure::The live Storage rules let a visitor read /cs files directly: $summary"
          else
            echo "::notice title=/cs Storage::Files cannot be read round the form: $summary"
          fi
          echo "Storage check: $summary" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the protection (only when asked)
        if: github.repository == 'polymathlc/cer' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.apply
        run: |
          set -euo pipefail
          if ! out=$(node tools/cs-rules.mjs --firebase-tools "$(npm root -g)/firebase-tools" --apply 2>"$RUNNER_TEMP/cs-rules.err"); then
            cat "$RUNNER_TEMP/cs-rules.err"
            echo "::error title=/cs rules publish::$(tail -3 "$RUNNER_TEMP/cs-rules.err" | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          echo "$out"
          msg="/cs protection: published=$(jq -r '.changed' <<<"$out"), $(jq -r '.validated' <<<"$out") permission cases pass, ruleset $(jq -r '.ruleset' <<<"$out")."
          echo "::notice title=/cs rules::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json" "$RUNNER_TEMP/cs-rules.err"
