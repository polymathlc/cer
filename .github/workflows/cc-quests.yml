name: Robux quest board (/cc)

# Checks for the /cc Robux Quest Board (Caius and Caris), and its protection in
# the SHARED Firestore rules of mathgen--app: ccQuests/**, ccLedger/** and
# ccSettings/** may be read by anyone (the children open the page without
# signing in) and changed only by Zhi Kai's verified Google accounts.
# tools/cc-rules.mjs only adds its own block and one predicate on the catch-all;
# every other app keeps exactly the permissions it has today, and it refuses
# rules it does not recognise.
#
#   pull request        offline checks and the browser check
#   push to main        the same, then a dry run against the LIVE rules (nothing changes)
#   Run workflow        the same, and with "apply" ticked it publishes the protection
#
# Needs the FIREBASE_SERVICE_ACCOUNT repository secret (also used by the trial,
# Office, enquiry, Online, Shop Guard and /cs rules).

on:
  pull_request:
    paths: ['cc/**', 'tools/cc-*', '.github/workflows/cc-quests.yml']
  push:
    branches: [main]
    paths: ['cc/**', 'tools/cc-*', '.github/workflows/cc-quests.yml']
  workflow_dispatch:
    inputs:
      apply:
        description: 'Publish the /cc protection to the shared Firestore rules'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline checks (Robux maths, avatars, privacy and the rules tool)
        run: |
          node --check tools/cc-rules.mjs
          node --test tools/cc-quests-tests.mjs
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Browser check at desktop and phone widths
        run: node tools/cc-quests-browser.mjs
        env:
          CC_SCREENSHOTS: artifacts/cc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cc-quest-board-previews
          path: artifacts/cc
          if-no-files-found: ignore

  firestore:
    needs: offline
    if: github.repository == 'polymathlc/cer' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: polymath-shared-rules
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare the service-account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tools/cc-rules.mjs --setup
      - name: Install the Firebase CLI
        run: npm install -g firebase-tools --no-audit --no-fund
      - name: Test every permission against the live Firestore rules, or publish when asked
        env:
          APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply && '--apply' || '' }}
        run: |
          set -euo pipefail
          if ! out=$(node tools/cc-rules.mjs --firebase-tools "$(npm root -g)/firebase-tools" $APPLY 2>"$RUNNER_TEMP/cc-fs.err"); then
            cat "$RUNNER_TEMP/cc-fs.err"
            echo "::error title=/cc Firestore rules::$(tail -2 "$RUNNER_TEMP/cc-fs.err" | tr '\n' ' ' | cut -c1-3500)"
            exit 1
          fi
          echo "$out"
          summary=$(jq -c '{mode, changed, changeNeeded, validated}' <<<"$out")
          echo "::notice title=/cc Firestore rules::$summary"
          echo "Firestore: $summary" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json" "$RUNNER_TEMP/cc-fs.err"
