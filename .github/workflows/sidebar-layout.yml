name: Sidebar layout editor
on:
  pull_request:
    paths: ['sidebar-layout-core.mjs', 'app.js', 'index.html', 'tools/sidebar-layout-*.mjs', 'tools/nav-groups-tests.mjs', '.github/workflows/sidebar-layout.yml']
  push:
    branches: [main]
    paths: ['sidebar-layout-core.mjs', 'app.js', 'index.html', 'tools/sidebar-layout-*.mjs', 'tools/nav-groups-tests.mjs', '.github/workflows/sidebar-layout.yml']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: The layout logic, the wiring, and the collapsible groups it sits on
        run: |
          node --test tools/sidebar-layout-tests.mjs
          node tools/nav-groups-tests.mjs
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: The admin edits and saves, a student and an employee sign in, a save arrives live
        run: node tools/sidebar-layout-browser.mjs
        env:
          NAV_LAYOUT_SCREENSHOTS: artifacts/sidebar-layout
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sidebar-layout-previews
          path: artifacts/sidebar-layout
          if-no-files-found: ignore
