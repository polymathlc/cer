name: Student access approval

# The enrolment pop-up every student app loads (student/access-gate.js), the
# sign-in + admin dashboard at polymathlc.com.sg/student (student/student-account.js)
# and the Firestore protection of studentAccess (tools/student-access-rules.mjs)
# in the SHARED rules of mathgen--app. The rules tool only adds its own block and
# one predicate to the catch-all; every other app keeps its permissions, and it
# refuses rules it does not recognise.
#
#   pull request        offline checks + the browser walk-through
#   push to main        the same, then every permission case is tested against
#                       the LIVE rules through the Rules API (nothing changes)
#   Run workflow        the same, and with "apply" ticked it publishes the rules
#
# The gate stays switched off (asks nobody, blocks nobody, collects nothing)
# until a signed-out read of studentAccess is refused — i.e. until this has been
# applied. Needs the FIREBASE_SERVICE_ACCOUNT repository secret.

on:
  pull_request:
    paths: ['student/access-gate.js', 'student/student-account.js', 'student/index.html', 'online/portal.js', 'online/portal-core.js', 'tools/student-access*', '.github/workflows/student-access.yml']
  push:
    branches: [main]
    paths: ['student/access-gate.js', 'student/student-account.js', 'student/index.html', 'online/portal.js', 'online/portal-core.js', 'tools/student-access*', '.github/workflows/student-access.yml']
  workflow_dispatch:
    inputs:
      apply:
        description: 'Publish the student access protection to the shared Firestore rules (switches the approval gate on)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: polymath-shared-rules
  cancel-in-progress: false

jobs:
  student-access:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Offline checks
        run: |
          node --check student/access-gate.js
          node --check student/student-account.js
          node --check tools/student-access-rules.mjs
          node --check tools/student-access-impact.mjs
          node --test tools/student-access-tests.mjs

      - name: Browser walk-through (pop-up, waiting, admin approves, pause)
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          node tools/student-access-browser.mjs
        env:
          ACCESS_SCREENSHOTS: artifacts/student-access

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-access-previews
          path: artifacts/student-access
          if-no-files-found: ignore

      - name: Prepare the service-account key
        if: github.repository == 'polymathlc/cer' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tools/student-access-rules.mjs --setup

      - name: Install the Firebase CLI
        if: github.repository == 'polymathlc/cer' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npm install -g firebase-tools --no-audit --no-fund

      - name: Test every permission against the live rules (changes nothing)
        if: github.repository == 'polymathlc/cer' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.apply
        run: |
          set -euo pipefail
          out=$(node tools/student-access-rules.mjs --firebase-tools "$(npm root -g)/firebase-tools")
          echo "$out"
          if [ "$(jq -r '.changeNeeded' <<<"$out")" = "true" ]; then
            echo "Student access protection: **not installed yet** (the gate is off); all $(jq -r '.validated' <<<"$out") permission cases pass. Run this workflow with apply ticked to publish it." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Student access protection: installed (the gate is on); all $(jq -r '.validated' <<<"$out") permission cases pass." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Who loses something under the subject rules (read only, counts only)
        if: github.repository == 'polymathlc/cer' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.apply
        continue-on-error: true
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/impact-deps" --no-save --no-audit --no-fund firebase-admin@12 >/dev/null
          out=$(IMPACT_DEPS="$RUNNER_TEMP/impact-deps" node tools/student-access-impact.mjs)
          echo "$out"
          { echo "### Subjects: who loses something"; tail -n +2 <<<"$out" | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the protection (only when asked)
        if: github.repository == 'polymathlc/cer' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.apply
        run: |
          set -euo pipefail
          out=$(node tools/student-access-rules.mjs --firebase-tools "$(npm root -g)/firebase-tools" --apply)
          echo "$out"
          echo "Student access protection: published=$(jq -r '.changed' <<<"$out"), $(jq -r '.validated' <<<"$out") permission cases pass, ruleset $(jq -r '.ruleset' <<<"$out")." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
