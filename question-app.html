<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Explore this question · Polymath</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f7fb;color:#17304c;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1100px;margin:0 auto;padding:24px 20px 40px}.brand{font-size:12px;letter-spacing:.13em;font-weight:750;color:#59728b;text-transform:uppercase}h1{font-size:clamp(24px,4vw,34px);line-height:1.2;margin:10px 0}.intro{color:#5c7087;margin:0 0 20px}.message{padding:20px;border:1px solid #d8e2ef;border-radius:12px;background:white}.error{border-color:#dfbcc1;color:#8c2537}.question-app-frame{min-height:560px}footer{margin-top:18px;font-size:12px;color:#6c7b8d}@media(max-width:600px){main{padding:16px 10px 24px}.question-app-frame{min-height:640px}}
  </style>
  <script src="question-apps.js" defer></script>
  <script src="question-app-viewer.js" defer></script>
</head>
<body>
  <main>
    <div class="brand">Polymath · Question explorer</div>
    <h1 id="app-title">Explore this question</h1>
    <p class="intro">Finished the question? Change the controls, make a prediction, and see what happens.</p>
    <div id="app-status" class="message" role="status">Loading the question app…</div>
    <div id="app-content"></div>
    <footer>Your answers are not recorded here. You can restart and explore as often as you like.</footer>
  </main>
</body>
</html>
