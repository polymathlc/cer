<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSLE 2023 Science Paper Analyser</title>
<style>
  :root {
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
    --hairline:#e1e0d9; --border:rgba(11,11,11,0.10);
    --accent:#2a78d6; --accent-deep:#1c5cab; --accent-track:#cde2fb; --accent-wash:rgba(42,120,214,0.08);
    --good:#0ca30c; --good-text:#006300; --warning:#eda100; --critical:#d03b3b;
    /* five PSLE themes — categorical slots 1-5 (light) */
    --t-diversity:#2a78d6; --t-cycles:#1baf7a; --t-systems:#eda100; --t-interactions:#4a3aa7; --t-energy:#eb6834;
    --shadow:0 1px 3px rgba(11,11,11,0.06), 0 4px 14px rgba(11,11,11,0.05);
  }
  :root[data-theme="dark"] {
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink-2:#c3c2b7; --ink-3:#898781;
    --hairline:#2c2c2a; --border:rgba(255,255,255,0.10);
    --accent:#3987e5; --accent-deep:#86b6ef; --accent-track:#0d366b; --accent-wash:rgba(57,135,229,0.14);
    --good:#0ca30c; --good-text:#0ca30c; --warning:#c98500; --critical:#e66767;
    --t-diversity:#3987e5; --t-cycles:#199e70; --t-systems:#c98500; --t-interactions:#9085e9; --t-energy:#d95926;
    --shadow:none;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink-2:#c3c2b7; --ink-3:#898781;
      --hairline:#2c2c2a; --border:rgba(255,255,255,0.10);
      --accent:#3987e5; --accent-deep:#86b6ef; --accent-track:#0d366b; --accent-wash:rgba(57,135,229,0.14);
      --good:#0ca30c; --good-text:#0ca30c; --warning:#c98500; --critical:#e66767;
      --t-diversity:#3987e5; --t-cycles:#199e70; --t-systems:#c98500; --t-interactions:#9085e9; --t-energy:#d95926;
      --shadow:none;
    }
  }

  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body {
    background:var(--page); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .shell { max-width:960px; margin:0 auto; padding:28px 20px 80px; }

  header.app { display:flex; align-items:center; gap:16px; padding:8px 4px 20px; }
  .app-mark { width:44px; height:44px; border-radius:12px; flex:none; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:22px; }
  .app-titles { flex:1; min-width:0; }
  .app-titles h1 { margin:0; font-size:20px; line-height:1.3; letter-spacing:-0.01em; }
  .app-titles p { margin:2px 0 0; font-size:13px; color:var(--ink-2); }
  .icon-btn { border:1px solid var(--border); background:var(--surface); color:var(--ink-2); border-radius:10px; padding:8px 12px; font-size:14px; cursor:pointer; }
  .icon-btn:hover { color:var(--ink); }

  nav.tabs { display:flex; gap:6px; flex-wrap:wrap; padding:6px; margin-bottom:24px; background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); position:sticky; top:10px; z-index:5; }
  nav.tabs button { flex:1; min-width:110px; border:none; background:transparent; color:var(--ink-2); font:inherit; font-size:14px; font-weight:500; padding:10px 12px; border-radius:10px; cursor:pointer; transition:background .15s,color .15s; }
  nav.tabs button:hover { color:var(--ink); background:var(--accent-wash); }
  nav.tabs button.active { background:var(--accent); color:#fff; }

  .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); padding:28px; margin-bottom:24px; }
  .card > h2 { margin:0 0 6px; font-size:17px; letter-spacing:-0.01em; }
  .card > .sub { margin:0 0 20px; font-size:14px; color:var(--ink-2); }
  .card h3 { font-size:15px; margin:0 0 4px; }

  .tile-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:16px; margin-bottom:24px; }
  .tile { background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); padding:20px 22px; }
  .tile .label { font-size:13px; color:var(--ink-2); margin-bottom:6px; }
  .tile .value { font-size:34px; font-weight:600; line-height:1.15; letter-spacing:-0.02em; }
  .tile .hint { font-size:12px; color:var(--ink-3); margin-top:6px; }
  .tile.hero .value { font-size:44px; color:var(--accent-deep); }

  /* bar chart */
  .bar-row { display:flex; align-items:center; gap:14px; padding:7px 0; }
  .bar-name { width:210px; flex:none; font-size:13.5px; display:flex; align-items:center; gap:8px; }
  .bar-name .dot { width:10px; height:10px; border-radius:3px; flex:none; }
  .bar-name .lv { font-size:11px; color:var(--ink-3); font-weight:600; }
  .bar-track { flex:1; height:22px; border-radius:5px; background:var(--accent-wash); overflow:hidden; display:flex; }
  .bar-fill { height:100%; border-radius:5px 0 0 5px; }
  .bar-val { width:64px; flex:none; text-align:right; font-size:13px; color:var(--ink-2); font-variant-numeric:tabular-nums; }
  @media (max-width:560px){ .bar-name{ width:130px; font-size:12px; } .bar-val{ width:48px; } }

  .legend { display:flex; flex-wrap:wrap; gap:14px; margin:2px 0 18px; font-size:12.5px; color:var(--ink-2); }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .legend .dot { width:11px; height:11px; border-radius:3px; }

  .split { display:flex; height:26px; border-radius:8px; overflow:hidden; border:1px solid var(--border); }
  .split div { display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:600; }

  /* filters */
  .filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .filters select, .filters button.chipf { border:1px solid var(--border); background:var(--page); color:var(--ink-2); font:inherit; font-size:13.5px; padding:8px 14px; border-radius:999px; cursor:pointer; }
  .filters button.chipf.on { background:var(--accent); border-color:var(--accent); color:#fff; }

  /* question cards */
  .q { border:1px solid var(--border); border-radius:14px; padding:16px 18px; margin-bottom:12px; }
  .q .q-head { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:4px; }
  .q .q-num { font-weight:700; font-size:15px; }
  .q .q-marks { font-size:12px; color:var(--ink-3); }
  .q .q-title { font-size:14.5px; margin:2px 0 10px; }
  .q .q-tags { display:flex; gap:8px; flex-wrap:wrap; }
  .tag { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:3px 10px; border-radius:999px; background:var(--accent-wash); color:var(--accent-deep); }
  .tag .dot { width:9px; height:9px; border-radius:2px; }
  .tag.lv { background:transparent; border:1px solid var(--border); color:var(--ink-2); }
  .tag.type { background:transparent; border:1px solid var(--border); color:var(--ink-2); }
  .tag.bk { background:transparent; border:1px solid var(--border); color:var(--ink-3); }
  .q details { margin-top:10px; }
  .q details summary { cursor:pointer; font-size:13px; color:var(--accent-deep); font-weight:600; list-style:none; }
  .q details summary::-webkit-details-marker { display:none; }
  .q details summary::before { content:"▸ "; }
  .q details[open] summary::before { content:"▾ "; }
  .q .q-detail { font-size:13.5px; color:var(--ink-2); padding:8px 0 2px; }
  .q .q-detail p { margin:6px 0; }
  .q .q-detail .ans { color:var(--good-text); font-weight:600; }

  /* topic deep dive */
  .topic-pick { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
  .topic-pick button { border:1px solid var(--border); background:var(--page); color:var(--ink-2); font:inherit; font-size:13px; padding:8px 13px; border-radius:10px; cursor:pointer; display:flex; align-items:center; gap:7px; }
  .topic-pick button.on { border-color:var(--accent); background:var(--accent-wash); color:var(--ink); }
  .topic-pick button .dot { width:9px; height:9px; border-radius:2px; }
  .topic-pick button .n { font-size:11px; color:var(--ink-3); }

  .kv { display:grid; grid-template-columns:auto 1fr; gap:6px 16px; font-size:14px; margin:12px 0 16px; }
  .kv dt { color:var(--ink-3); }
  .kv dd { margin:0; }

  .expect { border-left:3px solid var(--accent); padding:2px 0 2px 16px; margin:12px 0; }
  .expect h4 { margin:0 0 4px; font-size:14px; }
  .expect ul { margin:6px 0 0; padding-left:20px; font-size:13.5px; color:var(--ink-2); }
  .expect ul li { margin-bottom:5px; }

  .pill-list { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .pill-list a { text-decoration:none; }
  .qpill { border:1px solid var(--border); border-radius:8px; padding:5px 10px; font-size:12.5px; color:var(--ink-2); background:var(--page); }

  .qtype-card { border:1px solid var(--border); border-radius:14px; padding:20px 22px; margin-bottom:16px; }
  .qtype-card h3 { display:flex; align-items:center; gap:10px; margin:0 0 4px; }
  .qtype-card .meta { font-size:12.5px; color:var(--ink-3); margin-bottom:10px; }
  .qtype-card p { font-size:14px; color:var(--ink-2); margin:8px 0; }
  .qtype-card ul { font-size:13.5px; color:var(--ink-2); padding-left:20px; margin:8px 0; }
  .qtype-card ul li { margin-bottom:5px; }
  .qtype-card .eg { font-size:13px; background:var(--accent-wash); border-radius:10px; padding:12px 14px; margin-top:10px; }

  footer.app { text-align:center; color:var(--ink-3); font-size:12px; padding-top:12px; }
  .note { font-size:12.5px; color:var(--ink-3); }
  a.inline { color:var(--accent-deep); }

  @media (max-width:560px){ .card{ padding:20px; } }
</style>
</head>
<body>
<div class="shell">

  <header class="app">
    <div class="app-mark">🔬</div>
    <div class="app-titles">
      <h1>PSLE 2023 Science Paper Analyser</h1>
      <p>Every question in the 2023 paper (0009/2), classified into the CER portal's topics — with deep dives on question types and what to expect.</p>
    </div>
    <button class="icon-btn" data-action="toggle-theme" title="Toggle light / dark">◐</button>
  </header>

  <nav class="tabs" id="tabs">
    <button data-action="tab" data-tab="overview" class="active">Overview</button>
    <button data-action="tab" data-tab="questions">Question Map</button>
    <button data-action="tab" data-tab="topics">Topic Deep Dive</button>
    <button data-action="tab" data-tab="types">Question Types</button>
  </nav>

  <main>
    <section id="view-overview"></section>
    <section id="view-questions" hidden></section>
    <section id="view-topics" hidden></section>
    <section id="view-types" hidden></section>
  </main>

  <footer class="app">
    PSLE 2023 Science (0009/2) Analyser · <span id="appVersionBadge"></span> · topics mirror the CER portal taxonomy
  </footer>
</div>

<script type="module">
'use strict';

const APP_VERSION = 'v1.0.0';

/* ============================================================
   Theme taxonomy — maps the CER portal topics to the five
   PSLE Science themes (used for colour grouping).
   ============================================================ */
const THEMES = {
  diversity:    { name: 'Diversity',    varc: '--t-diversity' },
  cycles:       { name: 'Cycles',       varc: '--t-cycles' },
  systems:      { name: 'Systems',      varc: '--t-systems' },
  interactions: { name: 'Interactions', varc: '--t-interactions' },
  energy:       { name: 'Energy',       varc: '--t-energy' },
};

/* CER portal topic → {level, theme, whatToExpect[]} */
const TOPICS = {
  'Living and non-living things': { level:'P3', theme:'diversity',
    expect:[
      'Classification questions: sort organisms by observable features (gives birth vs lays eggs, can/cannot swim) using a two-way table.',
      'Characteristics of living things — respond, reproduce, grow — inferred from an experiment or observation (fruit flies multiplying, an organism moving toward light).',
      'Single-celled organisms and their cell parts appear in the newer syllabus; expect a diagram to label or reason about.',
    ]},
  'Materials': { level:'P3', theme:'diversity',
    expect:[
      'Match a material property (strength, flexibility, transparency, waterproof, floats) to the job an object must do.',
      'Property tables with tick/cross keys — pick the material whose row fits every requirement.',
    ]},
  'Life Cycles': { level:'P3', theme:'cycles',
    expect:[
      'Identify 3-stage vs 4-stage life cycles; group animals by number of stages.',
      'Draw a life cycle in words and arrows; state insect characteristics (3 body parts, 6 legs).',
      'Link temperature/environment to how fast a life cycle completes.',
    ]},
  'Magnets': { level:'P3', theme:'interactions',
    expect:[
      'Deduce whether an object is a magnet, magnetic material or non-magnetic from attraction/repulsion evidence (mass-balance set-ups).',
      'Magnetic force appearing alongside gravity and friction in a "which forces act" table.',
    ]},
  'Plant Systems': { level:'P4', theme:'systems',
    expect:[
      'Photosynthesis: read a graph of light amount vs rate; identify the levelling-off point.',
      'Leaf/root/stem functions and how a plant makes and uses its food.',
    ]},
  'Human Body Systems': { level:'P4', theme:'systems',
    expect:[
      'Digestive system: order the organs and reason about undigested food along the tract using a bar graph.',
      'Link a body system to its function in an applied context.',
    ]},
  'Matter and its 3 States': { level:'P4', theme:'cycles',
    expect:[
      'Decide what is / is not matter (light and heat are not matter).',
      'Changes of state — melting and solidifying — read off a temperature-time graph; explain a solid forming from a cooled liquid.',
    ]},
  'Light': { level:'P4', theme:'energy',
    expect:[
      'Shadows: how shadow length changes with distance from a light source; read a length-vs-time graph.',
    ]},
  'Heat': { level:'P4', theme:'energy',
    expect:[
      'Conductors vs insulators of heat (metal wire carrying heat to paper).',
      'Expansion and contraction — fitting a metal rim, glass cracking from uneven heating.',
      'Heat gain/loss and why one part of an object is hotter than another.',
    ]},
  'Water and its 3 States': { level:'P5', theme:'cycles',
    expect:[
      'Water cycle: identify evaporation, condensation and precipitation on a diagram.',
      'Evaporation as a cooling process — why a hand sanitiser dries fast and feels cold.',
    ]},
  'Plant Reproduction': { level:'P5', theme:'cycles',
    expect:[
      'Flower parts (stigma, style, ovary) and where pollination, fertilisation and seed development happen.',
      'Seed dispersal — match a structure (parachute, hook, wing) to its dispersal method.',
      'Germination investigations — conclude what seeds do / do not need.',
    ]},
  'Human Reproduction': { level:'P5', theme:'cycles',
    expect:['Not directly tested in this 2023 paper — but a standard topic: reproductive system parts and their functions.'] },
  'Human and Plant Respiration': { level:'P5', theme:'systems',
    expect:['Not directly tested in this 2023 paper — expect breathing system parts, gas exchange and respiration vs breathing.'] },
  'Human and Plant Transport': { level:'P5', theme:'systems',
    expect:[
      'Water-carrying vs food-carrying tubes and the direction each transports.',
      'Transpiration — leaves lose water through stomata; reason about leaf mass after sealing surfaces.',
      'Circulatory system — blood redistributed to muscles vs digestive system during exercise.',
    ]},
  'Electrical Systems': { level:'P5', theme:'systems',
    expect:[
      'Series vs parallel — brightness of bulbs, what can be swapped in without changing brightness.',
      'Why a bulb blows (too much current) and how to prevent it.',
      'Electromagnets — an iron core switching on/off, oscillating contacts, and the effect on connected bulbs.',
      'Draw/correct a circuit so bulbs stay lit if one blows (parallel) and only when the switch is closed.',
    ]},
  'Forces': { level:'P6', theme:'interactions',
    expect:[
      'Identify which forces (friction, gravity, magnetic, elastic) act in a situation using a tick/cross table.',
      'Spring/elastic force vs compression graphs; comparing two springs.',
      'Frictional force experiments — isolate the effect of mass vs surface area (fair test).',
      'Spot the incorrect statement about forces on a moving object ("the pushing force is used up").',
    ]},
  'Energy in Food': { level:'P6', theme:'energy',
    expect:['Not directly tested as a standalone item here — expect food as an energy store and photosynthesis links.'] },
  'Energy Conversion': { level:'P6', theme:'energy',
    expect:[
      'Fill an energy-conversion chain (elastic potential → kinetic + sound + heat).',
      'Link an input change (more turns of a propeller) to an output (greater distance), plus experimental variation between tries.',
    ]},
  'Living Together': { level:'P6', theme:'interactions',
    expect:[
      'Vocabulary of ecology — population, community, habitat — applied to a scene (all grasshoppers in a garden = a population).',
    ]},
  'Food Chains and Webs': { level:'P6', theme:'interactions',
    expect:[
      'Build a food web from "who eats whom" statements; reason about predator/prey and shelter advantages.',
    ]},
  'Humans and the Environment': { level:'P6', theme:'interactions',
    expect:[
      'Effects of human activity (deforestation → more carbon dioxide).',
      'Water-pollution investigations — variables, reliability (repeated readings), and interpreting which sample is least polluted.',
    ]},
};

/* ============================================================
   The 40 questions of the 2023 paper, classified.
   type: recall | application | data | experimental | open
   ============================================================ */
const SKILLS = {
  recall:       { name: 'Knowledge / recall' },
  application:  { name: 'Application' },
  data:         { name: 'Data interpretation' },
  experimental: { name: 'Experimental skills' },
  open:         { name: 'Open-ended explanation' },
};

const Q = [
  // ---- Booklet A: MCQ, 2 marks each ----
  { n:1,  bk:'A', marks:2, topic:'Humans and the Environment', type:'recall',
    title:'One effect of deforestation', ans:'Increase in carbon dioxide',
    detail:'Fewer trees means less photosynthesis removing CO₂, so atmospheric carbon dioxide rises. A direct human-impact recall item.' },
  { n:2,  bk:'A', marks:2, topic:'Life Cycles', type:'recall',
    title:'Which group has a three-stage life cycle', ans:'Chicken, frog and grasshopper',
    detail:'Three-stage (no pupa): grasshopper (egg→nymph→adult), plus chicken and frog. Butterfly and beetle are four-stage. Tests knowing stage counts across animal groups.' },
  { n:3,  bk:'A', marks:2, topic:'Plant Reproduction', type:'application',
    title:'What structures R and S help seeds do', ans:'Disperse',
    detail:'A feathery/parachute structure and a winged/hooked structure are seed-dispersal adaptations (wind / animal). Apply dispersal knowledge to unfamiliar structures.' },
  { n:4,  bk:'A', marks:2, topic:'Human Body Systems', type:'data',
    title:'Graph of undigested food leaving each digestive organ', ans:'Option showing least→most along mouth→large intestine',
    detail:'Order organs A–E along the digestive tract, then match the bar graph where undigested food increases toward the large intestine. Combines system knowledge with graph reading.' },
  { n:5,  bk:'A', marks:2, topic:'Living and non-living things', type:'application',
    title:'Two-way table — which group animal X belongs to', ans:'Group B (lays eggs, can swim)',
    detail:'Animal X is a bird (beak, feathers, webbed feet): it lays eggs and can swim → group B. Classification using a can-swim / gives-birth table.' },
  { n:6,  bk:'A', marks:2, topic:'Living and non-living things', type:'data',
    title:'Temperature most suitable for both bacteria P and Q', ans:'30 °C',
    detail:'Read the overlap of two curves — the temperature where both bacteria populations are high. Bacteria as living things + graph interpretation.' },
  { n:7,  bk:'A', marks:2, topic:'Human and Plant Transport', type:'application',
    title:'How food from exposed leaves is transported', ans:'Upwards and downwards by the food-carrying tubes',
    detail:'Food (from photosynthesis) travels in the food tubes both up and down the plant. Distinguishes water tubes from food tubes.' },
  { n:8,  bk:'A', marks:2, topic:'Plant Reproduction', type:'application',
    title:'Female flower parts P, Q, R — which statements are correct', ans:'A and C only',
    detail:'P (stigma) is where pollen lands ✓; R (ovary) is where a seed develops ✓; fertilisation happens in the ovary, not Q (style) ✗. Precise flower-part functions.' },
  { n:9,  bk:'A', marks:2, topic:'Living and non-living things', type:'experimental',
    title:'Fair test — what goes into container Q', ans:'Ants + food, but no substance S',
    detail:'The control must be identical except for the one variable being tested (substance S). Fair-test design around living things responding to a stimulus.' },
  { n:10, bk:'A', marks:2, topic:'Plant Systems', type:'data',
    title:'Light amount vs rate of photosynthesis — who is correct', ans:'Both Sherwin and Michael',
    detail:'Rate rises from 0–1500 units, then plateaus (light no longer limiting). Both statements read correctly off the graph.' },
  { n:11, bk:'A', marks:2, topic:'Living Together', type:'recall',
    title:'Term for all the grasshoppers in a garden', ans:'Population',
    detail:'All members of one species in an area = a population. Core ecology vocabulary.' },
  { n:12, bk:'A', marks:2, topic:'Human and Plant Transport', type:'application',
    title:'Leaf mass in increasing order after sealing surfaces with oil', ans:'A, C, B, D',
    detail:'Leaves lose water through stomata (more on the underside). Most water lost = lightest. No oil (A) loses most; oil both sides (D) loses least. Transpiration reasoning.' },
  { n:13, bk:'A', marks:2, topic:'Plant Reproduction', type:'experimental',
    title:'Light and germination/growth conclusion', ans:'B and C only',
    detail:'Both containers germinated → seeds don’t need light to germinate; the dark seedlings grew taller → faster growth in the dark. Draw conclusions from an investigation.' },
  { n:14, bk:'A', marks:2, topic:'Living and non-living things', type:'data',
    title:'Fruit-fly numbers over 25 days — conclusion and cause of death', ans:'Living things reproduce; death from lack of air (overcrowding)',
    detail:'Rising numbers show reproduction; the later die-off points to too little air as the population overcrowds. Inference from a pictorial data series.' },
  { n:15, bk:'A', marks:2, topic:'Materials', type:'application',
    title:'Property of a crab shell that supports and protects', ans:'Strength',
    detail:'Supporting the body and protecting organs needs a strong material. Match property to function.' },
  { n:16, bk:'A', marks:2, topic:'Water and its 3 States', type:'application',
    title:'Which process on the water-cycle diagram is condensation', ans:'B only',
    detail:'B is water vapour turning into cloud droplets (condensation); A is evaporation, C is precipitation. Label a process on the cycle.' },
  { n:17, bk:'A', marks:2, topic:'Forces', type:'application',
    title:'Which forces act on magnet B when it stops on a slope', ans:'Friction, gravitational and magnetic',
    detail:'On a slope, held stationary near another magnet: gravity pulls it down, friction and magnetic force balance it. Identify multiple simultaneous forces.' },
  { n:18, bk:'A', marks:2, topic:'Materials', type:'experimental',
    title:'Most suitable material for netting (property table)', ans:'Material A (strong, flexible, lets light through)',
    detail:'Netting must be strong, flexible and let light through — only one row ticks all three. Read a tick/cross property table.' },
  { n:19, bk:'A', marks:2, topic:'Heat', type:'application',
    title:'Fitting a metal rim onto a too-big wheel', ans:'Heat the rim and place it over the wheel',
    detail:'Heating expands the rim so it slips over the wheel, then contracts to grip. Expansion of matter on heating.' },
  { n:20, bk:'A', marks:2, topic:'Heat', type:'application',
    title:'Why part X of a paper lantern started to burn', ans:'Metal is a good conductor of heat',
    detail:'The metal wire conducts heat from the flame to the paper at X, scorching it. Conduction through a good conductor.' },
  { n:21, bk:'A', marks:2, topic:'Electrical Systems', type:'application',

/* ============================================================
   Derived aggregates
   ============================================================ */
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function themeOf(topic){ return TOPICS[topic] ? TOPICS[topic].theme : 'diversity'; }
function levelOf(topic){ return TOPICS[topic] ? TOPICS[topic].level : ''; }

const TOTAL_MARKS = Q.reduce((s,q)=>s+q.marks,0);

function marksByTopic(){
  const m = {};
  Object.keys(TOPICS).forEach(t => { m[t] = { marks:0, count:0 }; });
  Q.forEach(q => { m[q.topic].marks += q.marks; m[q.topic].count++; });
  return m;
}
function marksByLevel(){
  const m = { P3:0, P4:0, P5:0, P6:0 };
  Q.forEach(q => { m[levelOf(q.topic)] += q.marks; });
  return m;
}
function marksByTheme(){
  const m = {};
  Object.keys(THEMES).forEach(t => m[t]=0);
  Q.forEach(q => { m[themeOf(q.topic)] += q.marks; });
  return m;
}
function marksByType(){
  const m = {};
  Object.keys(SKILLS).forEach(t => m[t]={marks:0,count:0});
  Q.forEach(q => { m[q.type].marks += q.marks; m[q.type].count++; });
  return m;
}

/* ============================================================
   Rendering
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let activeTab = 'overview';
let qFilter = { topic:'', bk:'', type:'' };
let activeTopic = 'Electrical Systems';

function themeDot(theme){ return `<span class="dot" style="background:var(${THEMES[theme].varc})"></span>`; }

function renderOverview(){
  const el = $('#view-overview');
  const byTopic = marksByTopic();
  const byLevel = marksByLevel();
  const byTheme = marksByTheme();
  const byType = marksByType();

  // topic bars sorted by marks desc, skip zero-mark topics but note them
  const topicRows = Object.keys(TOPICS)
    .map(t => ({ t, ...byTopic[t] }))
    .filter(r => r.marks > 0)
    .sort((a,b) => b.marks - a.marks);
  const maxTopic = Math.max(...topicRows.map(r=>r.marks));
  const notTested = Object.keys(TOPICS).filter(t => byTopic[t].marks === 0);

  const topicBars = topicRows.map(r => {
    const th = themeOf(r.t);
    return `<div class="bar-row">
      <div class="bar-name">${themeDot(th)}<span>${esc(r.t)}</span> <span class="lv">${levelOf(r.t)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(r.marks/maxTopic*100).toFixed(1)}%; background:var(${THEMES[th].varc})"></div></div>
      <div class="bar-val">${r.marks}m · ${r.count}Q</div>
    </div>`;
  }).join('');

  const themeLegend = Object.entries(THEMES).map(([k,v]) =>
    `<span>${themeDot(k)} ${esc(v.name)} · ${byTheme[k]}m</span>`).join('');

  // booklet split
  const aMarks = Q.filter(q=>q.bk==='A').reduce((s,q)=>s+q.marks,0);
  const bMarks = TOTAL_MARKS - aMarks;

  // level split bar
  const levelBar = ['P3','P4','P5','P6'].map((lv,i) => {
    const pct = (byLevel[lv]/TOTAL_MARKS*100).toFixed(1);
    const shades = ['--t-diversity','--t-cycles','--t-systems','--t-interactions'];
    return `<div style="width:${pct}%; background:var(${shades[i]})">${lv} · ${byLevel[lv]}m</div>`;
  }).join('');

  const typeBar = Object.keys(SKILLS).map((k,i) => {
    const pct = (byType[k].marks/TOTAL_MARKS*100).toFixed(1);
    const shades = ['--t-diversity','--t-cycles','--t-systems','--t-interactions','--t-energy'];
    return `<div class="bar-row">
      <div class="bar-name"><span class="dot" style="background:var(${shades[i]})"></span>${esc(SKILLS[k].name)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(byType[k].marks/TOTAL_MARKS*100).toFixed(1)}%; background:var(${shades[i]})"></div></div>
      <div class="bar-val">${byType[k].marks}m · ${byType[k].count}Q</div>
    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="tile-row">
      <div class="tile hero"><div class="label">Questions</div><div class="value">40</div><div class="hint">Booklet A: Q1–28 · Booklet B: Q29–40</div></div>
      <div class="tile"><div class="label">Total marks</div><div class="value">${TOTAL_MARKS}</div><div class="hint">56 (MCQ) + 44 (open-ended)</div></div>
      <div class="tile"><div class="label">Duration</div><div class="value">1h45</div><div class="hint">Booklets A and B combined</div></div>
      <div class="tile"><div class="label">Topics covered</div><div class="value">${Object.keys(TOPICS).length - notTested.length}</div><div class="hint">of ${Object.keys(TOPICS).length} CER-portal topics</div></div>
    </div>

    <div class="card">
      <h2>Paper anatomy</h2>
      <p class="sub">The paper is one code (0009/2) split into two booklets sat back-to-back in 1 hour 45 minutes.</p>
      <div class="split" style="margin-bottom:8px">
        <div style="width:${(aMarks/TOTAL_MARKS*100)}%; background:var(--accent)">Booklet A · MCQ · ${aMarks} marks</div>
        <div style="width:${(bMarks/TOTAL_MARKS*100)}%; background:var(--accent-deep)">Booklet B · open-ended · ${bMarks} marks</div>
      </div>
      <p class="note">Booklet A is 28 four-option MCQs (2 marks each, shade on the OAS). Booklet B is 12 structured questions (Q29–40) written in the booklet, 1–5 marks each.</p>
    </div>

    <div class="card">
      <h2>Marks by CER-portal topic</h2>
      <p class="sub">Every question mapped to the portal's topic list, coloured by the five PSLE Science themes.</p>
      <div class="legend">${themeLegend}</div>
      ${topicBars}
      <p class="note" style="margin-top:14px">Not assessed in this paper: ${notTested.map(esc).join(' · ')}. (Standard topics that simply didn't come up in 2023 — still worth revising.)</p>
    </div>

    <div class="card">
      <h2>Coverage by level</h2>
      <p class="sub">The paper draws across all four years, with the P5 topics carrying the most marks this year.</p>
      <div class="split">${levelBar}</div>
    </div>

    <div class="card">
      <h2>What skill each question tests</h2>
      <p class="sub">Beyond content, PSLE Science rewards process skills. Here's how this paper's marks split by the skill demanded.</p>
      ${typeBar}
      <p class="note" style="margin-top:12px">Roughly half the marks (Booklet B) need written explanations — the biggest mark-loser is answering these without the marking keywords.</p>
    </div>`;
}

function renderQuestions(){
  const el = $('#view-questions');

  const topicOpts = ['<option value="">All topics</option>']
    .concat(Object.keys(TOPICS).filter(t=>Q.some(q=>q.topic===t))
      .map(t => `<option value="${esc(t)}" ${qFilter.topic===t?'selected':''}>${esc(t)} (${levelOf(t)})</option>`)).join('');

  const typeChips = Object.keys(SKILLS).map(k =>
    `<button class="chipf ${qFilter.type===k?'on':''}" data-action="qfilter" data-kind="type" data-val="${k}">${esc(SKILLS[k].name)}</button>`).join('');

  const bkChips = ['A','B'].map(b =>
    `<button class="chipf ${qFilter.bk===b?'on':''}" data-action="qfilter" data-kind="bk" data-val="${b}">Booklet ${b}</button>`).join('');

  const filtered = Q.filter(q =>
    (!qFilter.topic || q.topic===qFilter.topic) &&
    (!qFilter.bk || q.bk===qFilter.bk) &&
    (!qFilter.type || q.type===qFilter.type));

  const cards = filtered.map(q => {
    const th = themeOf(q.topic);
    return `<div class="q">
      <div class="q-head">
        <span class="q-num">Q${q.n}</span>
        <span class="q-marks">${q.marks} mark${q.marks===1?'':'s'} · Booklet ${q.bk}</span>
      </div>
      <div class="q-title">${esc(q.title)}</div>
      <div class="q-tags">
        <span class="tag">${themeDot(th)}${esc(q.topic)}</span>
        <span class="tag lv">${levelOf(q.topic)}</span>
        <span class="tag type">${esc(SKILLS[q.type].name)}</span>
      </div>
      <details>
        <summary>Analysis${q.ans?' &amp; suggested answer':''}</summary>
        <div class="q-detail">
          <p>${esc(q.detail)}</p>
          ${q.ans?`<p><span class="ans">Suggested answer:</span> ${esc(q.ans)}</p>`:''}
        </div>
      </details>
    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="card">
      <h2>Question map — all 40 classified</h2>
      <p class="sub">Each question tagged with its CER-portal topic, level and the skill it tests. Filter to drill in. Expand any card for the analysis and a suggested answer.</p>
      <div class="filters">
        <select data-action="qfilter-topic">${topicOpts}</select>
        ${bkChips}
      </div>
      <div class="filters">${typeChips}
        <button class="chipf" data-action="qfilter-clear">Clear filters</button>
      </div>
      <p class="note" style="margin-bottom:16px">Showing ${filtered.length} of ${Q.length} questions${qFilter.topic?` · ${esc(qFilter.topic)}`:''}${qFilter.bk?` · Booklet ${qFilter.bk}`:''}${qFilter.type?` · ${esc(SKILLS[qFilter.type].name)}`:''}.</p>
      ${cards || '<p class="empty-note note">No questions match these filters.</p>'}
    </div>`;
}

function renderTopics(){
  const el = $('#view-topics');
  const byTopic = marksByTopic();
  const tested = Object.keys(TOPICS).filter(t => byTopic[t].marks > 0);

  const picker = tested.map(t => {
    const th = themeOf(t);
    return `<button class="${activeTopic===t?'on':''}" data-action="topicpick" data-topic="${esc(t)}">
      <span class="dot" style="background:var(${THEMES[th].varc})"></span>${esc(t)} <span class="n">${byTopic[t].marks}m</span>
    </button>`;
  }).join('');

  const info = TOPICS[activeTopic];
  const qs = Q.filter(q => q.topic===activeTopic).sort((a,b)=>a.n-b.n);
  const marks = byTopic[activeTopic].marks;
  const typeSet = [...new Set(qs.map(q=>SKILLS[q.type].name))];

  const qPills = qs.map(q =>
    `<span class="qpill">Q${q.n} · ${q.marks}m · ${esc(SKILLS[q.type].name)}</span>`).join('');

  const expectList = info.expect.map(e => `<li>${esc(e)}</li>`).join('');

  el.innerHTML = `
    <div class="card">
      <h2>Topic deep dive</h2>
      <p class="sub">Pick a topic to see how it showed up in 2023 and what to expect from it. Ordered by marks in this paper.</p>
      <div class="topic-pick">${picker}</div>

      <h3 style="display:flex; align-items:center; gap:9px; font-size:16px; margin-top:8px">
        ${themeDot(themeOf(activeTopic))} ${esc(activeTopic)}
      </h3>
      <dl class="kv">
        <dt>Level</dt><dd>${levelOf(activeTopic)}</dd>
        <dt>Theme</dt><dd>${esc(THEMES[themeOf(activeTopic)].name)}</dd>
        <dt>In 2023</dt><dd>${qs.length} question${qs.length===1?'':'s'} · ${marks} mark${marks===1?'':'s'} (${(marks/TOTAL_MARKS*100).toFixed(0)}% of the paper)</dd>
        <dt>Skills tested</dt><dd>${typeSet.map(esc).join(', ')}</dd>
      </dl>

      <div class="expect">
        <h4>What to expect from this topic</h4>
        <ul>${expectList}</ul>
      </div>

      <h3 style="margin-top:18px">This topic's questions in 2023</h3>
      <div class="pill-list">${qPills}</div>
      <p class="note" style="margin-top:10px">Switch to the Question Map tab and filter by this topic to read each one's analysis.</p>
    </div>`;
}

function renderTypes(){
  const el = $('#view-types');
  const byType = marksByType();

  const cards = [
    { k:'recall', icon:'📌',
      what:'Direct knowledge — a fact, definition or term recalled with no working.',
      how:['Read every option before committing; the obvious answer is sometimes a distractor.','These are your banked marks — know the vocabulary cold (population, matter, condensation, dispersal).'],
      eg:'Q11 asks for the term for all grasshoppers in a garden — "population". Q25 asks which is NOT matter — a beam of light.' },
    { k:'application', icon:'🧩',
      what:'A known concept dropped into an unfamiliar object, animal or set-up. The costume is new; the concept is always from the syllabus.',
      how:['Ask "which topic is this really about?" and strip away the unfamiliar context.','Reason to your own answer first, then match it to an option.','This is the largest MCQ category — practising unfamiliar contexts is the training.'],
      eg:'Q19 (fitting a metal rim by heating it to expand) and Q3 (unfamiliar seed structures that aid dispersal) both wrap a plain concept in a new scenario.' },
    { k:'data', icon:'📊',
      what:'Read exact values, trends or comparisons off a graph, table or pictorial series.',
      how:['Read the axes and units first, before looking at the shape.','Quote start and end values; say where a curve rises, plateaus or falls.','Run a finger across rows and down columns to avoid transfer errors.'],
      eg:'Q10 (light vs photosynthesis rate — rises then plateaus at 1500 units) and Q4 (undigested food along the digestive tract as a bar graph).' },
    { k:'experimental', icon:'⚗️',
      what:'Process skills — fair testing, identifying variables, judging reliability, choosing a valid control or comparison.',
      how:['Name the three variables: changed, measured, kept constant.','A fair test changes only one thing; the control is identical except for that one variable.','Reliability comes from repeated, consistent readings — not from a single measurement.'],
      eg:'Q9 (what the control container needs for a fair test), Q27 (pick the pair that isolates surface area), and Q31 (variables + reliability of a pollution investigation).' },
    { k:'open', icon:'✍️',
      what:'Written answers in Booklet B, marked against specific keywords. Sensible-but-vague answers score zero.',
      how:['Answer in Claim–Evidence–Reasoning shape: answer directly, quote the data/set-up, then give the concept with its keywords.','Use precise, comparative language: "gains/loses heat", "more/less than" — never "hot" or "big".','If the question says "based on the results", your answer must quote the data.','Match the command word: state = one line; explain = cause linked to concept; compare = both sides named.'],
      eg:'Q38 (the 5-mark electromagnet question — explain the make-and-break oscillation) and Q35 (why the hand feels colder — evaporation absorbs heat from the skin).' },
  ];

  const html = cards.map(c => `
    <div class="qtype-card">
      <h3>${c.icon} ${esc(SKILLS[c.k].name)}</h3>
      <div class="meta">${byType[c.k].count} question${byType[c.k].count===1?'':'s'} · ${byType[c.k].marks} marks (${(byType[c.k].marks/TOTAL_MARKS*100).toFixed(0)}% of the paper)</div>
      <p>${esc(c.what)}</p>
      <strong style="font-size:13.5px">How to handle it</strong>
      <ul>${c.how.map(h=>`<li>${esc(h)}</li>`).join('')}</ul>
      <div class="eg"><strong>From this paper:</strong> ${esc(c.eg)}</div>
    </div>`).join('');

  el.innerHTML = `
    <div class="card">
      <h2>Question types — what to expect</h2>
      <p class="sub">The 2023 paper mixes five kinds of demand. Booklet A leans on the first four; Booklet B is all written explanation. Knowing the type tells you how to attack the question.</p>
      ${html}
    </div>`;
}

const RENDERERS = { overview:renderOverview, questions:renderQuestions, topics:renderTopics, types:renderTypes };

function render(){
  Object.keys(RENDERERS).forEach(tab => { document.getElementById('view-'+tab).hidden = tab!==activeTab; });
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab===activeTab));
  RENDERERS[activeTab]();
}

/* events */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-action]');
  if (!t) return;
  const a = t.dataset.action;
  if (a === 'tab') { activeTab = t.dataset.tab; render(); window.scrollTo({top:0}); }
  else if (a === 'toggle-theme') {
    const dark = getComputedStyle(document.body).backgroundColor !== 'rgb(249, 249, 247)';
    document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
    try { localStorage.setItem('psleAnalyser.theme', dark ? 'light' : 'dark'); } catch(_){}
    render();
  }
  else if (a === 'qfilter') { const k=t.dataset.kind, v=t.dataset.val; qFilter[k] = qFilter[k]===v ? '' : v; renderQuestions(); }
  else if (a === 'qfilter-clear') { qFilter = {topic:'',bk:'',type:''}; renderQuestions(); }
  else if (a === 'topicpick') { activeTopic = t.dataset.topic; renderTopics(); window.scrollTo({top:0}); }
});
document.addEventListener('change', ev => {
  const t = ev.target.closest('[data-action]');
  if (!t) return;
  if (t.dataset.action === 'qfilter-topic') { qFilter.topic = t.value; renderQuestions(); }
});

/* boot */
try { const th = localStorage.getItem('psleAnalyser.theme'); if (th==='light'||th==='dark') document.documentElement.setAttribute('data-theme', th); } catch(_){}
document.getElementById('appVersionBadge').textContent = APP_VERSION;
render();
</script>
