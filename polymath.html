<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">

<title>The Polymath</title>
<link rel="icon" href="assets/branding/polymath-learning-centre.png">
<!--
  🧠 THE POLYMATH — where a QR code on an exported answer key lands.
  The page is `polymath-tutor.js`; the rules are `polymath-tutor-core.mjs`.
  This file is the look, and the doors to the outside world (the paper,
  the model, a picture, the Study Buddy account, its mistake book and the
  voice call's credentials), which are the only Firebase on the page.
  The voice and the crystal are `polymath-voice.js`.
  See "🧠 The Polymath" in CLAUDE.md.
-->
<style>
  :root {
    --pt-bg: #F7F7F5;
    --pt-surface: #FFFFFF;
    --pt-text: #1A1A1A;
    --pt-muted: #6B6B6B;
    --pt-line: #E6E6E2;
    --pt-accent: #BBDEFB;
    --pt-accent-strong: #90CAF9;
    --pt-accent-ink: #0D3C61;
    --pt-good: #2E7D32; --pt-good-bg: #E8F5E9;
    --pt-part: #F9A825; --pt-part-bg: #FFF8E1;
    --pt-bad: #C62828; --pt-bad-bg: #FFEBEE;
    --pt-shadow-card: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.06);
    --pt-shadow-btn: 0 1px 2px rgba(0,0,0,0.05), 0 2px 8px rgba(0,0,0,0.08);
    --pt-shadow-btn-hover: 0 2px 4px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.12);
    --pt-radius: 16px;
    --pt-font: 'Century Gothic', CenturyGothic, AppleGothic, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--pt-bg); color: var(--pt-text); font-family: var(--pt-font); font-size: 16px; line-height: 1.55; -webkit-text-size-adjust: 100%; }
  button, input, textarea { font: inherit; color: inherit; }
  #app { min-height: 100vh; }

  .pt-header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; background: rgba(255,255,255,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--pt-line); }
  .pt-brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
  .pt-logo { height: 40px; width: auto; flex: none; }
  .pt-brand-text { display: flex; flex-direction: column; min-width: 0; }
  .pt-brand-text strong { font-size: 1.05rem; letter-spacing: 0.02em; white-space: nowrap; }
  .pt-brand-text span { font-size: 0.8rem; color: var(--pt-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pt-score { flex: none; font-size: 0.82rem; background: var(--pt-accent); color: var(--pt-accent-ink); padding: 5px 11px; border-radius: 999px; }

  .pt-main { max-width: 720px; margin: 0 auto; padding: 20px 16px 64px; }
  .pt-card { background: var(--pt-surface); border-radius: var(--pt-radius); box-shadow: var(--pt-shadow-card); padding: 20px; margin: 0 0 16px; }
  .pt-muted { color: var(--pt-muted); font-size: 0.88rem; }
  h1 { font-size: 1.5rem; margin: 0 0 8px; letter-spacing: 0.01em; }
  h2 { font-size: 1.1rem; margin: 0 0 10px; }

  .pt-loading { text-align: center; padding: 40px 20px; }
  .pt-spinner { width: 34px; height: 34px; margin: 0 auto 12px; border: 3px solid var(--pt-accent); border-top-color: var(--pt-accent-ink); border-radius: 50%; animation: pt-spin 0.8s linear infinite; }
  @keyframes pt-spin { to { transform: rotate(360deg); } }
  .pt-error h2 { color: var(--pt-bad); }

  .pt-btn { appearance: none; border: 1px solid var(--pt-line); background: var(--pt-surface); border-radius: 12px; padding: 11px 16px; font-weight: 600; cursor: pointer; box-shadow: var(--pt-shadow-btn); transition: box-shadow 0.25s ease, transform 0.25s ease, background 0.2s ease; min-height: 44px; }
  .pt-btn:hover:not(:disabled) { box-shadow: var(--pt-shadow-btn-hover); transform: translateY(-1px); }
  .pt-btn:active:not(:disabled) { transform: translateY(0.5px); }
  .pt-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .pt-primary { background: var(--pt-accent); border-color: var(--pt-accent-strong); color: var(--pt-accent-ink); }
  .pt-primary:hover:not(:disabled) { background: var(--pt-accent-strong); }
  .pt-link { appearance: none; border: 0; background: none; padding: 6px 0; color: var(--pt-accent-ink); font-weight: 600; cursor: pointer; }
  .pt-icon-btn { appearance: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--pt-line); background: var(--pt-surface); font-size: 1.4rem; line-height: 1; cursor: pointer; box-shadow: var(--pt-shadow-btn); }
  .pt-icon-btn:disabled { opacity: 0.35; cursor: default; }

  .pt-progress { height: 8px; background: #EEF3F8; border-radius: 99px; overflow: hidden; margin: 14px 0 6px; }
  .pt-progress span { display: block; height: 100%; background: var(--pt-accent-strong); border-radius: 99px; transition: width 0.4s ease; }
  .pt-intro .pt-btn { margin-top: 10px; }
  .pt-qlist { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .pt-qlist > li { min-width: 0; }
  .pt-qrow { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; border: 1px solid transparent; background: var(--pt-surface); border-radius: 14px; padding: 12px 14px; cursor: pointer; box-shadow: var(--pt-shadow-btn); transition: box-shadow 0.25s ease, transform 0.25s ease; }
  .pt-qrow:hover { box-shadow: var(--pt-shadow-btn-hover); transform: translateY(-1px); }
  .pt-qdot { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: #F0F0EC; font-size: 0.9rem; }
  .pt-qrow.pt-correct .pt-qdot { background: var(--pt-good-bg); color: var(--pt-good); }
  .pt-qrow.pt-partial .pt-qdot { background: var(--pt-part-bg); color: #8D6E00; }
  .pt-qrow.pt-incorrect .pt-qdot { background: var(--pt-bad-bg); color: var(--pt-bad); }
  .pt-qrow-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .pt-qrow-text span { font-size: 0.85rem; color: var(--pt-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pt-qrow-state { flex: none; font-size: 0.78rem; color: var(--pt-muted); }

  .pt-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .pt-nav-arrows { display: flex; gap: 8px; }
  .pt-q-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .pt-q-head h1 { margin: 0 8px 0 0; }
  .pt-chip { font-size: 0.75rem; background: #F0F0EC; color: var(--pt-muted); padding: 3px 9px; border-radius: 99px; }
  .pt-part { display: inline-block; font-weight: 700; margin-right: 6px; color: var(--pt-accent-ink); }
  .pt-text { margin: 10px 0; }
  .pt-figure { margin: 12px 0; text-align: center; }
  .pt-figure img { max-width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--pt-line); background: #fff; }
  .pt-figure figcaption { font-size: 0.82rem; color: var(--pt-muted); margin-top: 4px; }
  .pt-table-wrap { overflow-x: auto; margin: 12px 0; }
  .pt-table { border-collapse: collapse; min-width: 100%; font-size: 0.92rem; }
  .pt-table th, .pt-table td { border: 1px solid var(--pt-line); padding: 6px 10px; text-align: left; vertical-align: top; }
  .pt-table th { background: #F7F7F5; }

  .pt-mcq { display: grid; gap: 8px; margin: 12px 0; }
  .pt-option { display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--pt-line); background: var(--pt-surface); cursor: pointer; transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease; min-height: 48px; }
  .pt-option:hover { border-color: var(--pt-accent-strong); }
  .pt-option.pt-chosen { border-color: var(--pt-accent-ink); background: #EAF4FD; }
  .pt-option-label { font-weight: 700; flex: none; }
  .pt-option-body img { display: block; max-width: 100%; margin-top: 6px; border-radius: 8px; }
  .pt-write-wrap { display: block; margin: 12px 0; }
  .pt-write-label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
  .pt-write, .pt-chat-input { width: 100%; border: 1.5px solid var(--pt-line); border-radius: 12px; padding: 12px; resize: vertical; background: #FCFCFB; transition: border-color 0.2s ease; font-size: 16px; }
  .pt-write:focus, .pt-chat-input:focus, .pt-blank:focus { outline: none; border-color: var(--pt-accent-ink); background: #fff; }
  .pt-fill { line-height: 2.4; margin: 12px 0; }
  .pt-blank { width: 8.5em; border: 0; border-bottom: 2px solid var(--pt-accent-strong); background: #F5FAFE; padding: 2px 6px; border-radius: 6px 6px 0 0; font-size: 16px; }

  .pt-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 16px; }
  .pt-actions .pt-btn { flex: 1 1 150px; }
  .pt-feedback { border-left: 5px solid var(--pt-part); animation: pt-in 0.35s ease both; }
  .pt-feedback.pt-correct { border-left-color: var(--pt-good); }
  .pt-feedback.pt-incorrect { border-left-color: var(--pt-bad); animation: pt-in 0.35s ease both, pt-shake 0.4s ease 0.35s; }
  .pt-verdict { display: flex; align-items: center; gap: 8px; font-size: 1.05rem; }
  .pt-verdict-icon { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--pt-part-bg); color: #8D6E00; }
  .pt-correct .pt-verdict-icon { background: var(--pt-good-bg); color: var(--pt-good); }
  .pt-incorrect .pt-verdict-icon { background: var(--pt-bad-bg); color: var(--pt-bad); }
  .pt-next { font-weight: 600; color: var(--pt-accent-ink); }
  .pt-hint { background: #FFFDF5; animation: pt-in 0.35s ease both; }
  .pt-solution { background: #F5FAFE; animation: pt-in 0.35s ease both; }
  .pt-inline-error { color: var(--pt-bad); font-size: 0.9rem; margin: -6px 0 14px; }
  .pt-chat-log { display: grid; gap: 10px; margin-bottom: 12px; }
  .pt-bubble { padding: 10px 14px; border-radius: 14px; max-width: 92%; }
  .pt-bubble b { display: block; font-size: 0.75rem; color: var(--pt-muted); margin-bottom: 2px; }
  .pt-bubble.pt-student { background: #EAF4FD; justify-self: end; }
  .pt-bubble.pt-tutor { background: #F4F4F1; }
  .pt-chat-form { display: flex; gap: 8px; align-items: flex-end; }
  .pt-chat-form .pt-btn { flex: none; }
  .pt-next-bar { display: flex; justify-content: flex-end; }

  /* 👤 The Study Buddy account, in the header. */
  .pt-account { flex: none; display: flex; align-items: center; gap: 8px; font-size: 0.82rem; }
  .pt-account-name { max-width: 9em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--pt-muted); }
  .pt-account .pt-btn { min-height: 36px; padding: 6px 12px; font-size: 0.82rem; }
  .pt-book-note { display: flex; gap: 10px; align-items: flex-start; background: #FFF7FB; border: 1px solid #F6D3E6; border-radius: 12px; padding: 12px 14px; margin: 14px 0 0; font-size: 0.9rem; }
  .pt-book-note .pt-btn { flex: none; min-height: 36px; padding: 6px 12px; font-size: 0.85rem; }
  .pt-filed { margin: 10px 0 0; font-size: 0.85rem; color: #7A1E63; }

  /* 🎙 THE CRYSTAL. Everything that moves is driven by two numbers the
     controller writes every frame — --pm-level (how loud right now) and
     --pm-mic (the student's own voice) — plus the phase on data-phase. */
  .pm-voice { --pm-level: 0.1; --pm-mic: 0; --pm-tint: #5FD4C9; --pm-tint2: #C46BD8; display: flex; align-items: center; gap: 18px; position: relative; overflow: hidden;
    background: radial-gradient(120% 140% at 0% 0%, #F2FFFD 0%, #FFFFFF 45%, #FBF4FF 100%); border: 1px solid #E4F3F1; }
  .pm-voice[data-phase="listening"] { --pm-tint: #4FC3F7; --pm-tint2: #5FD4C9; }
  .pm-voice[data-phase="thinking"] { --pm-tint: #9C7CF0; --pm-tint2: #E25FAE; }
  .pm-voice[data-phase="speaking"] { --pm-tint: #E25FAE; --pm-tint2: #5FD4C9; }
  .pm-voice[data-phase="error"] { --pm-tint: #B0BEC5; --pm-tint2: #CFD8DC; }
  .pm-stage { flex: none; width: 148px; height: 170px; display: grid; place-items: center; position: relative; }
  .pm-stage::before { content: ''; position: absolute; inset: 6px; border-radius: 50%; background: radial-gradient(circle, var(--pm-tint) 0%, transparent 68%);
    opacity: calc(0.18 + var(--pm-level) * 0.75); transform: scale(calc(0.8 + var(--pm-level) * 0.45)); filter: blur(10px); transition: background 0.6s ease; }
  .pm-crystal { appearance: none; border: 0; background: none; padding: 0; width: 132px; height: 158px; cursor: pointer; position: relative; border-radius: 40%;
    -webkit-tap-highlight-color: transparent; transition: transform 0.25s ease; }
  .pm-crystal:focus-visible { outline: 3px solid var(--pt-accent-ink); outline-offset: 4px; }
  .pm-crystal:active { transform: scale(0.96); }
  .pm-crystal-svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .pm-float { transform-origin: 100px 112px; transform: scale(calc(0.94 + var(--pm-level) * 0.16)); animation: pm-bob 4.2s ease-in-out infinite; }
  .pm-gem { filter: saturate(calc(1 + var(--pm-level) * 0.6)) brightness(calc(1 + var(--pm-level) * 0.25)); transition: filter 0.2s ease; }
  .pm-halo { transform-origin: 100px 112px; opacity: calc(0.35 + var(--pm-level) * 0.65); transform: scale(calc(0.85 + var(--pm-level) * 0.4)); }
  .pm-rays { transform-origin: 100px 112px; opacity: calc(var(--pm-level) * 0.9); animation: pm-turn 18s linear infinite; }
  .pm-ring { transform-origin: 100px 112px; opacity: 0.25; animation: pm-turn 9s linear infinite; }
  .pm-core { opacity: calc(0.4 + var(--pm-level) * 0.6); }
  .pm-facet { transition: opacity 0.3s ease; }
  .pm-f5, .pm-f9 { opacity: calc(0.75 + var(--pm-level) * 0.25); }
  .pm-spark { transform-box: fill-box; transform-origin: center; opacity: 0; animation: pm-twinkle 2.8s ease-in-out infinite; }
  .pm-s2 { animation-delay: 0.7s; } .pm-s3 { animation-delay: 1.4s; } .pm-s4 { animation-delay: 2.1s; }
  .pm-shadow { transform-origin: 100px 226px; transform: scaleX(calc(1.04 - var(--pm-level) * 0.2)); }
  .pm-voice[data-phase="listening"] .pm-ring { opacity: calc(0.45 + var(--pm-mic) * 0.55); }
  .pm-voice[data-phase="thinking"] .pm-ring { opacity: 0.9; animation-duration: 1.6s; }
  .pm-voice[data-phase="thinking"] .pm-gem { animation: pm-glint 1.2s ease-in-out infinite; }
  .pm-voice[data-phase="speaking"] .pm-rays { animation-duration: 6s; }
  .pm-voice[data-phase="speaking"] .pm-spark { animation-duration: 1.1s; }
  .pm-voice[data-phase="error"] .pm-float { animation: none; }
  .pm-voice[data-phase="error"] .pm-gem { filter: grayscale(0.7); }
  .pm-voice [hidden] { display: none !important; }   /* .pm-log is a grid; hidden must still hide it */
  .pm-panel { flex: 1; min-width: 0; }
  .pm-panel h2 { margin: 0 0 6px; }
  .pm-status { margin: 0 0 12px; min-height: 1.55em; font-weight: 600; color: var(--pt-accent-ink); }
  .pm-voice[data-phase="error"] .pm-status { color: var(--pt-bad); font-weight: 500; }
  .pm-clock { color: var(--pt-muted); font-weight: 400; font-variant-numeric: tabular-nums; }
  .pm-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .pm-actions .pt-btn { flex: 1 1 130px; }
  .pm-mute[aria-pressed="true"] { background: var(--pt-bad-bg); border-color: #F3B6B6; }
  .pm-log { display: grid; gap: 6px; max-height: 210px; overflow-y: auto; padding: 10px 12px; margin: 0 0 10px; background: rgba(255,255,255,0.7); border: 1px solid var(--pt-line); border-radius: 12px; font-size: 0.9rem; }
  .pm-line b { font-size: 0.72rem; color: var(--pt-muted); display: block; }
  .pm-line.pm-you span { color: var(--pt-text); }
  .pm-line.pm-tutor span { color: #5A1550; }
  .pm-note { margin: 0; font-size: 0.78rem; }
  @keyframes pm-bob { 0%,100% { translate: 0 0; } 50% { translate: 0 -5px; } }
  @keyframes pm-turn { to { rotate: 360deg; } }
  @keyframes pm-twinkle { 0%,100% { opacity: 0; scale: 0.4; } 45% { opacity: 1; scale: 1; } 60% { opacity: 0.8; scale: 0.8; } }
  @keyframes pm-glint { 0%,100% { opacity: 1; } 50% { opacity: 0.78; } }
  @media (max-width: 520px) {
    .pm-voice { flex-direction: column; text-align: center; gap: 6px; }
    .pm-stage { width: 128px; height: 148px; }
    .pm-crystal { width: 116px; height: 138px; }
    .pm-actions { justify-content: center; }
    .pm-log { text-align: left; }
    .pt-account-name { display: none; }   /* the intro card names who is signed in */
    .pt-score { padding: 4px 8px; }
  }

  .pt-reveal > * { animation: pt-in 0.4s ease both; }
  .pt-reveal > *:nth-child(2) { animation-delay: 0.06s; }
  .pt-reveal > *:nth-child(3) { animation-delay: 0.12s; }
  .pt-reveal > *:nth-child(4) { animation-delay: 0.18s; }
  @keyframes pt-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pt-shake { 0%,100% { transform: none; } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  @media (max-width: 420px) { .pt-card { padding: 16px; } h1 { font-size: 1.3rem; } .pt-logo { height: 34px; } }
  @media print { .pt-header { position: static; } .pm-voice, .pt-account, .pt-actions, .pt-chat-form, .pt-nav-arrows, .pt-next-bar { display: none; } .pt-card { box-shadow: none; border: 1px solid #ccc; } }
</style>

<body>
<div id="app" aria-live="polite"></div>
<noscript><p style="padding:20px">The Polymath needs JavaScript switched on.</p></noscript>
<script type="module">
import { mountPolymathTutor } from './polymath-tutor.js?v=2';
import { TUTOR_COLLECTION, TUTOR_NAME } from './polymath-tutor-core.mjs?v=2';

const root = document.getElementById('app');
// The Firebase door is opened lazily and once: a broken CDN is a message on
// the page, never a blank screen.
let firebaseReady = null;
function firebase() {
  if (!firebaseReady) firebaseReady = (async () => {
    const [{ initializeApp }, ac, fs, ai, au] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/11.10.0/firebase-app-check.js'),
      import('https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js'),
      import('https://www.gstatic.com/firebasejs/11.10.0/firebase-ai.js'),
      import('https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js'),
    ]);
    // The shared Polymath project — the same config every app in the family uses.
    const app = initializeApp({
      apiKey: "AIzaSyAUSI3Uh28IeqASEp0JhH4QPaVt-O3meBo",
      authDomain: "mathgen--app.firebaseapp.com",
      projectId: "mathgen--app",
      storageBucket: "mathgen--app.firebasestorage.app",
      messagingSenderId: "165654161198",
      appId: "1:165654161198:web:16c8bd60eb3a2aa7edbcbf",
      measurementId: "G-0MWZFG211D"
    });
    // App Check is what lets an anonymous phone use the model without a key,
    // and its token is the second half of every voice call's credentials.
    let appCheck = null;
    try { appCheck = ac.initializeAppCheck(app, { provider: new ac.ReCaptchaV3Provider("6Le98gwtAAAAAAzkjJTZXFM5D8tpjx_P4rtRuhuH"), isTokenAutoRefreshEnabled: true }); }
    catch (e) { console.warn('App Check could not start', e); }
    const db = fs.getFirestore(app);
    const auth = au.getAuth(app);
    // The portal's own tutor engine, under The Polymath's name. Keep the model and its
    // thinking floor in step with AI_MODEL / AI_THINK_MIN in app.js.
    const model = ai.getGenerativeModel(ai.getAI(app, { backend: new ai.GoogleAIBackend() }), { model: 'gemini-3.8-flash' });
    return { app, db, fs, model, auth, au, ac, appCheck };
  })();
  return firebaseReady;
}

async function loadPaper(id) {
  const { db, fs } = await firebase();
  const snap = await fs.getDoc(fs.doc(db, TUTOR_COLLECTION, id));
  return snap.exists() ? snap.data() : null;
}

async function ask(prompt, opts) {
  const { model } = await firebase();
  const parts = [{ text: prompt }];
  ((opts && opts.images) || []).forEach(img => parts.push({ inlineData: { mimeType: img.mimeType, data: img.data } }));
  const generationConfig = { maxOutputTokens: 1600, temperature: 0.4, thinkingConfig: { thinkingLevel: 'low' } };
  if (opts && opts.json) generationConfig.responseMimeType = 'application/json';
  let res;
  try { res = await model.generateContent({ contents: [{ role: 'user', parts }], generationConfig }); }
  catch (e) {
    const msg = String((e && e.message) || e);
    if (/429|quota|exceeded/i.test(msg)) throw new Error(TUTOR_NAME + ' is very busy right now');
    if (/app.?check|unauthenticated|permission/i.test(msg)) throw new Error(TUTOR_NAME + ' could not confirm this page — reload it');
    throw new Error(TUTOR_NAME + ' could not be reached — check your connection');
  }
  return (res.response.text() || '').trim();
}

// A picture for the model, as base64. A picture the browser may not read
// (no CORS) is simply left out: the words of the question still go.
async function fetchImage(url) {
  const m = /^data:(image\/[a-z+]+);base64,(.*)$/i.exec(url);
  if (m) return { mimeType: m[1], data: m[2] };
  const res = await fetch(url, { credentials: 'omit', referrerPolicy: 'no-referrer' });
  if (!res.ok) return null;
  const blob = await res.blob();
  if (!/^image\//.test(blob.type) || blob.size > 4 * 1024 * 1024) return null;
  const data = await new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1] || '');
    r.onerror = () => reject(r.error);
    r.readAsDataURL(blob);
  });
  return data ? { mimeType: blob.type, data } : null;
}

/* 👤 THE STUDY BUDDY ACCOUNT. The same Google sign-in Study Buddy uses, on
   the same project, so the uid here IS the student's Study Buddy uid and
   their mistake book is the one this page writes into. An anonymous user
   (made only so a phone with no account can still talk) is reported as
   `anonymous: true` and the page treats it as signed out. */
function person(u) {
  if (!u) return null;
  return { uid: u.uid, anonymous: !!u.isAnonymous, name: u.displayName || '', email: u.email || '' };
}
const account = {
  watch(cb) {
    let off = () => {};
    firebase().then(({ auth, au }) => { off = au.onAuthStateChanged(auth, u => cb(person(u))); })
      .catch(() => cb(null));
    return () => off();
  },
  async signIn() {
    const { auth, au } = await firebase();
    const provider = new au.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    try { return person((await au.signInWithPopup(auth, provider)).user); }
    catch (e) {
      const code = String((e && e.code) || '');
      // A phone that blocks pop-ups gets the same sign-in as a full-page trip.
      if (/popup-blocked|operation-not-supported|web-storage/.test(code)) { await au.signInWithRedirect(auth, provider); return null; }
      if (/popup-closed|cancelled-popup/.test(code)) return null;
      throw new Error('Signing in did not work. Please try again.');
    }
  },
  async signOut() { const { auth, au } = await firebase(); await au.signOut(auth); },
  // The roster row Study Buddy keeps: the student's own name and level.
  async profile(uid) {
    const { db, fs } = await firebase();
    try {
      const snap = await fs.getDoc(fs.doc(db, 'studentProfiles', uid));
      if (!snap.exists()) return null;
      const p = snap.data() || {};
      const kid = p.tutorOnboard && Array.isArray(p.tutorOnboard.students) ? p.tutorOnboard.students[0] || {} : {};
      return { name: String(kid.name || p.name || ''), level: String(kid.level || p.level || '') };
    } catch (e) { return null; }
  }
};

/* 📕 THE MISTAKE BOOK, written the way Study Buddy writes it:
   users/{uid}/mistakes/{id}. `createdAt` only on the first write, so a card
   keeps its place in the book when the question is tried again. */
const mistakes = {
  async file(uid, id, data) {
    const { db, fs, auth } = await firebase();
    if (!auth.currentUser || auth.currentUser.uid !== uid || auth.currentUser.isAnonymous) throw new Error('Not signed in');
    const ref = fs.doc(db, 'users', uid, 'mistakes', id);
    const snap = await fs.getDoc(ref);
    const stamp = fs.serverTimestamp();
    if (snap.exists()) await fs.updateDoc(ref, Object.assign({}, data, { updatedAt: stamp }));
    else await fs.setDoc(ref, Object.assign({}, data, { createdAt: stamp, updatedAt: stamp }));
    return true;
  },
  async clear(uid, id) {
    const { db, fs, auth } = await firebase();
    if (!auth.currentUser || auth.currentUser.uid !== uid || auth.currentUser.isAnonymous) return false;
    const ref = fs.doc(db, 'users', uid, 'mistakes', id);
    const snap = await fs.getDoc(ref);
    if (!snap.exists() || snap.data().cleared) return false;
    await fs.updateDoc(ref, { cleared: true, updatedAt: fs.serverTimestamp() });
    return true;
  }
};

/* 🎙 WHAT A VOICE CALL NEEDS: a Firebase user (the signed-in one, or an
   anonymous one made at the tap) and a fresh App Check token. */
const voice = {
  async getUser() {
    const { auth, au } = await firebase();
    if (auth.currentUser) return auth.currentUser;
    try { return (await au.signInAnonymously(auth)).user; }
    catch (e) { throw new Error('Sign in with your Study Buddy account to talk to ' + TUTOR_NAME + '.'); }
  },
  async getAppCheckToken() {
    const { ac, appCheck } = await firebase();
    if (!appCheck) throw new Error('The page could not be verified. Reload it and try again.');
    const got = await ac.getToken(appCheck, false);
    return got && got.token;
  }
};

mountPolymathTutor(root, { loadPaper, ask, fetchImage, account, mistakes, voice });
</script>
