<title>Try again — Polymath Learning Centre</title>

<!--
  ═══════════════════════════════════════════════════════════════════
  TRY AGAIN  ·  the worksheet a student's own mistakes come back as
  ───────────────────────────────────────────────────────────────────
  The Scan app (polymathlc/scan) marks a photographed paper and keeps
  every question the student got wrong in their own mistake book. When
  they choose some and press "Make a worksheet", that app writes ONE
  document to `scanPapers/{id}` and emails a link to this page.

  WHY IT LIVES IN THIS REPO. This app already owns the two things the
  worksheet needs — the printed-worksheet look, and an image model
  that can clean a photographed figure up. The Scan app owns the
  photographs, so it does the cropping; this does the rendering and
  the clean-up.

  WHAT IT MUST NEVER DO IS DISTURB THIS APP. It is a standalone file,
  like bar-model.html and fps.html: it does not load app.js, it is not
  a page inside the portal, and it reads and writes exactly TWO things
  — the `scanPapers` document named in the URL, and pictures under
  `scan-mistakes/` in Storage. It never touches the question bank, the
  vetting list, the teaching notes, a hero, a leaderboard or a
  student's progress. A scanned question must not appear anywhere in
  this app's own content, which is the whole reason the Scan app's
  collections are namespaced away from this one's.

  TWO VERSIONS OF EVERY QUESTION, and the wording is the SAME in both.
  What differs is only the picture:
    • CLEANED UP (the default) — the figure redrawn as sharp black and
      white line-work with the student's own pencil rubbed out, so the
      question is blank again and can honestly be re-attempted.
    • ORIGINAL — the rectangle exactly as it was photographed.
  The wording, the options and the answers are the transcription the
  Scan app already made and the teacher already marked against; an
  image model never gets to rewrite a number in the question, only to
  redraw the diagram beside it.

  Nothing on this page is generated from scratch. If the image model
  is unavailable or refuses, the original photograph is shown and the
  page SAYS so — a blank space where a diagram should be is a question
  nobody can answer.
  ═══════════════════════════════════════════════════════════════════
-->

<style>
  :root {
    --bg: #FFFFFF;
    --bg-soft: #F7F6F4;
    --ink: #1A1A1A;
    --ink-soft: #55554F;
    --ink-faint: #8A8A84;
    --accent: #DCEBDD;
    --accent-deep: #4C8C52;
    --line: #ECECEA;
    --radius: 16px;
    --radius-sm: 11px;
    --shadow-card: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.06);
    --font: 'Century Gothic', CenturyGothic, AppleGothic, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font); color: var(--ink); background: var(--bg-soft);
    -webkit-text-size-adjust: 100%; line-height: 1.6;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 22px 18px 70px; }

  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 16px 22px; background: var(--bg); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 20;
  }
  .brandMark {
    width: 40px; height: 40px; border-radius: 11px; background: var(--accent);
    display: grid; place-items: center; font-size: 20px; flex: none;
  }
  .brandTitle { font-weight: 700; font-size: 1rem; }
  .brandSub { font-size: 0.74rem; color: var(--ink-faint); }
  .spacer { flex: 1; }

  .btn {
    font-family: var(--font); font-size: 0.88rem; font-weight: 600;
    padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,.05); white-space: nowrap;
  }
  .btn:hover:not(:disabled) { background: var(--bg-soft); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent-deep); }

  .card {
    background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow-card); padding: 26px 28px; margin-bottom: 20px;
  }
  .card h2 { font-size: 1.1rem; margin-bottom: 10px; }
  .sub { font-size: 0.88rem; color: var(--ink-soft); line-height: 1.7; }
  .hint { font-size: 0.8rem; color: var(--ink-faint); line-height: 1.65; }

  /* ---------- The mode switch ----------
     Two buttons, not a dropdown: which version you are looking at is the
     single most important thing on this page and it has to be readable at a
     glance, from across a table, by a parent. */
  .modeBar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
  .modeBtn {
    font-family: var(--font); font-size: 0.86rem; font-weight: 600;
    padding: 10px 18px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink-soft);
  }
  .modeBtn.on { background: var(--accent); border-color: var(--accent-deep); color: var(--ink); }
  .modeNote { font-size: 0.8rem; color: var(--ink-faint); margin-top: 10px; line-height: 1.6; }

  .prog { margin-top: 14px; display: none; }
  .prog.on { display: block; }
  .progBar { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .progFill { height: 100%; width: 0; background: var(--accent-deep); transition: width .3s ease; }
  .progText { font-size: 0.8rem; color: var(--ink-soft); margin-top: 8px; }

  /* ---------- The sheet ----------
     A worksheet, on screen, at something close to the shape it prints at, so
     what is being previewed really is what comes out of the printer. */
  .sheet {
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow-card); padding: 40px 44px; margin-bottom: 20px;
  }
  .shHead { border-bottom: 2px solid var(--ink); padding-bottom: 14px; margin-bottom: 8px; }
  .shTitle { font-size: 1.15rem; font-weight: 700; }
  .shOrg { font-size: 0.8rem; color: var(--ink-soft); margin-top: 4px; }
  .shName {
    display: flex; gap: 24px; flex-wrap: wrap;
    font-size: 0.82rem; color: var(--ink-soft); margin: 16px 0 26px;
  }
  .shName span { border-bottom: 1px solid var(--ink-faint); min-width: 150px; padding-bottom: 2px; }
  /* The instruction that closes the loop. It PRINTS — the whole point is that
     it is read off the paper, away from any screen. */
  .shHow {
    font-size: 0.8rem; color: var(--ink-soft); line-height: 1.6; margin: -12px 0 26px;
    padding: 10px 14px; border-radius: 8px; background: var(--bg-soft); border: 1px solid var(--line);
  }

  /* One heading per subject, and only on a paper that really holds more than
     one. A sheet that is all maths says so once, in its title. */
  .shSubj {
    margin: 22px 0 -4px; padding-bottom: 6px; border-bottom: 1px solid var(--ink);
    font-size: 0.92rem; font-weight: 700; break-after: avoid; page-break-after: avoid;
  }
  .shSubj:first-of-type { margin-top: 6px; }
  .shSubjSub { font-weight: 400; color: var(--ink-soft); font-size: 0.78rem; }

  .q { padding: 20px 0; border-bottom: 1px solid var(--line); break-inside: avoid; }
  .q:last-child { border-bottom: 0; }
  .qHead { display: flex; gap: 10px; align-items: baseline; margin-bottom: 10px; }
  .qNum { font-weight: 700; font-size: 0.95rem; flex: none; }
  .qMeta { font-size: 0.72rem; color: var(--ink-faint); }
  .qText { font-size: 0.94rem; line-height: 1.75; white-space: pre-wrap; }
  .qFig { margin: 16px 0; text-align: center; }
  .qFig img { max-width: 100%; max-height: 340px; border: 1px solid var(--line); border-radius: 6px; }
  .qFig .figNote { font-size: 0.72rem; color: var(--ink-faint); margin-top: 6px; }
  .qOpts { list-style: none; margin: 12px 0 0; display: flex; flex-direction: column; gap: 6px; }
  .qOpts li { font-size: 0.9rem; padding: 5px 0; }
  .qWork { margin-top: 14px; border: 1px solid var(--line); border-radius: 8px; min-height: 96px; }
  .qWork.short { min-height: 52px; }
  .qLine { margin-top: 16px; font-size: 0.88rem; color: var(--ink-soft); }
  .qLine b { border-bottom: 1px solid var(--ink); display: inline-block; min-width: 170px; }

  /* ---------- The answers, at the back ---------- */
  .keyPage { break-before: page; }
  .keyRow { padding: 14px 0; border-bottom: 1px solid var(--line); break-inside: avoid; }
  .keyRow:last-child { border-bottom: 0; }
  .keyNum { font-weight: 700; font-size: 0.88rem; }
  .keyAns { font-size: 0.9rem; margin-top: 5px; }
  .keyWhy { font-size: 0.84rem; color: var(--ink-soft); margin-top: 5px; line-height: 1.7; }
  .keyYou { font-size: 0.82rem; color: #8C2E1D; margin-top: 5px; }

  .empty {
    color: var(--ink-faint); text-align: center; padding: 46px 20px;
    border: 1px dashed var(--line); border-radius: var(--radius); font-size: 0.92rem; line-height: 1.7;
  }
  .hidden { display: none !important; }

  @media print {
    header, .noPrint { display: none !important; }
    body { background: #fff; }
    .wrap { max-width: none; padding: 0; }
    .sheet { border: 0; box-shadow: none; border-radius: 0; padding: 0 0 12mm; margin: 0; }
    .q, .keyRow { break-inside: avoid; }
    .qFig img { max-height: 260px; }
  }
  @page { size: A4; margin: 14mm; }
</style>
</head>
<body>

<header class="noPrint">
  <div class="brandMark">📕</div>
  <div>
    <div class="brandTitle">Try again</div>
    <div class="brandSub">Polymath Learning Centre · <span id="verTag"></span></div>
  </div>
  <div class="spacer"></div>
  <span class="hint" id="whoAmI"></span>
  <button class="btn" id="signInBtn">Sign in</button>
  <button class="btn hidden" id="signOutBtn">Sign out</button>
</header>

<div class="wrap">
  <div id="gate" class="card">
    <h2>Your worksheet</h2>
    <p class="sub" id="gateText">Opening…</p>
    <div style="margin-top:16px" id="gateBtns"></div>
  </div>

  <div id="paperWrap" class="hidden">
    <div class="card noPrint">
      <h2 id="pTitle">Try again</h2>
      <p class="sub" id="pSub"></p>
      <div class="modeBar">
        <button class="modeBtn on" id="modeClean">🧽 Cleaned up</button>
        <button class="modeBtn" id="modeOriginal">📷 The original photo</button>
        <div class="spacer"></div>
        <button class="btn primary" id="printBtn">🖨 Print / save as PDF</button>
      </div>
      <p class="modeNote" id="modeNote"></p>
      <div class="prog" id="prog">
        <div class="progBar"><div class="progFill" id="progFill"></div></div>
        <div class="progText" id="progText"></div>
      </div>
    </div>
    <div id="sheet"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { initializeAppCheck, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app-check.js";
import { getAI, getGenerativeModel, GoogleAIBackend } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-ai.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc }
  from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
import { getStorage, ref as sRef, uploadString, getDownloadURL }
  from "https://www.gstatic.com/firebasejs/11.10.0/firebase-storage.js";

const APP_VERSION = 'v1.2.0';
document.getElementById('verTag').textContent = APP_VERSION;

/* The one collection this page reads, and the one folder it writes. Named
   here, once, so nothing below can quietly reach into this app's own data —
   which is the whole contract with the Scan app. */
/* The four subjects, spelled the way the Scan app spells them (`SUBJECTS`
   there). This page loads no app.js, so it carries its own map — a value it
   does not know is printed as it stands rather than dropped, because a
   question under no heading at all reads as a printing fault. */
const SUBJECT_LABEL = { science: 'Science', math: 'Mathematics', english: 'English', chinese: 'Chinese' };
function subjectLabel(v) { return SUBJECT_LABEL[v] || (v || ''); }

const PAPER_COL = 'scanPapers';
const IMG_PATH = 'scan-mistakes';
const ADMIN_EMAILS = ['chungzhikai@gmail.com'];

const firebaseConfig = {
  apiKey: "AIzaSyAUSI3Uh28IeqASEp0JhH4QPaVt-O3meBo",   // public web config, not a secret
  authDomain: "mathgen--app.firebaseapp.com",
  projectId: "mathgen--app",
  storageBucket: "mathgen--app.firebasestorage.app",
  messagingSenderId: "165654161198",
  appId: "1:165654161198:web:16c8bd60eb3a2aa7edbcbf",
  measurementId: "G-0MWZFG211D"
};
const RECAPTCHA_SITE_KEY = "6Le98gwtAAAAAAzkjJTZXFM5D8tpjx_P4rtRuhuH";

const app = initializeApp(firebaseConfig);
if (RECAPTCHA_SITE_KEY && !RECAPTCHA_SITE_KEY.startsWith("PASTE_")) {
  try {
    initializeAppCheck(app, { provider: new ReCaptchaV3Provider(RECAPTCHA_SITE_KEY), isTokenAutoRefreshEnabled: true });
  } catch (e) { console.warn('App Check init failed:', e); }
}
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

/* The image models, in the same order and with the same fallback the portal's
   own art and diagram work uses: the newer one first, the older one behind it,
   because a project without access to one very often has the other. */
const AI_IMAGE_MODELS = ["gemini-3.1-flash-image-preview", "gemini-2.5-flash-image"];
let imageModels = [];
try {
  const ai = getAI(app, { backend: new GoogleAIBackend() });
  imageModels = AI_IMAGE_MODELS.map(m => getGenerativeModel(ai, { model: m }));
} catch (e) { console.warn('Firebase AI init failed (clean-up disabled):', e); }
const imageAiReady = () => imageModels.length > 0;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* =====================================================================
   CLEANING THE FIGURE UP
   ---------------------------------------------------------------------
   The crop is a photograph of a page a child has written on. Two things have
   to happen to it and they pull in opposite directions: the HANDWRITING has
   to go, because a question you can still see your own wrong answer on is not
   a question you can honestly try again; and NOTHING PRINTED may change,
   because the wording beside it is the transcription the teacher marked
   against and a diagram that disagrees with it is worse than a grey photo.

   So the prompt is explicit in both directions, and everything around it is
   built to fail safe: a model that will not answer, an answer that is not an
   image, a project with no image model at all — each of them leaves the
   ORIGINAL photograph on the page with a line saying so.
   ===================================================================== */
const CLEAN_PROMPT =
  'SOURCE: this is a photograph or scan of one figure cut out of a printed school worksheet or exam paper, and a ' +
  'student has written on the page in pen or pencil. Expect faint or broken printed lines, a grey or unevenly lit ' +
  'background, speckle and dirt, show-through from the back of the sheet, shadows, slight skew and blur.\n' +
  'TASK: redraw this as a clean BLACK-AND-WHITE line figure — crisp black line-work and text on a plain white ' +
  'background, the way it looked when it was freshly printed, before anybody wrote on it.\n' +
  'REMOVE, because they are not part of the question: every handwritten mark — pencil and pen working, numbers ' +
  'the student has written in, arrows and jottings they have added, circled or ticked answers, crossings-out, ' +
  'underlining they have drawn, and any marking in red. Remove the scanning damage too: speckle, dirt, shadows, ' +
  'show-through, staple and punch marks, and the grey cast.\n' +
  'KEEP EXACTLY AS THEY ARE, and this matters more than the cleaning: every PRINTED line, shape, arrow, axis, ' +
  'label, number, unit and word, in the same places, at the same proportions, saying the same thing. Straighten ' +
  'what is meant to be straight and darken a faint printed stroke to a solid one, but never add a label, a ' +
  'number, an axis value or a shape that is not there, and never replace a character you cannot read with a ' +
  'plausible one — reproduce what is printed. If you cannot tell a printed mark from a handwritten one, KEEP it.\n' +
  'Do not add shading, colour, gradients, texture, a border, a caption or a new style, and do not rearrange ' +
  'anything. Output only the image, at the same aspect ratio.';

function inlineImageOf(result) {
  const parts = result?.response?.inlineDataParts ? result.response.inlineDataParts() : [];
  for (const p of parts || []) {
    const img = p.inlineData || p;
    if (img?.data && img?.mimeType?.startsWith('image/')) return img;
  }
  const cands = result?.response?.candidates || result?.candidates || [];
  for (const c of cands) {
    for (const p of (c?.content?.parts || [])) {
      const img = p.inlineData || p.inline_data;
      if (img?.data && img?.mimeType?.startsWith('image/')) return img;
      if (img?.data && img?.mime_type?.startsWith('image/')) return { data: img.data, mimeType: img.mime_type };
    }
  }
  return null;
}
async function cleanFigure(dataUrl) {
  if (!imageAiReady()) throw new Error('no image model');
  const mime = (/^data:([^;,]+)/.exec(dataUrl) || [])[1] || 'image/jpeg';
  const parts = [CLEAN_PROMPT, { inlineData: { mimeType: mime, data: dataUrl.split(',')[1] || '' } }];
  let last = null;
  for (const model of imageModels) {
    try {
      const res = await model.generateContent(parts);
      const img = inlineImageOf(res);
      if (img) return 'data:' + (img.mimeType || 'image/png') + ';base64,' + img.data;
      last = new Error('the model did not return a picture');
    } catch (e) { last = e; console.warn('clean-up model failed', e); }
  }
  throw last || new Error('the figure could not be cleaned');
}

/* A Storage URL cannot be handed to a model, and a canvas that has drawn a
   cross-origin picture cannot be read back. So the crop is fetched as a data
   URL first, and a fetch that fails is simply a figure that stays original. */
async function urlToDataUrl(url) {
  const resp = await fetch(url, { mode: 'cors', cache: 'no-store' });
  if (!resp.ok) throw new Error('the picture could not be loaded');
  const blob = await resp.blob();
  return await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(new Error('the picture could not be read'));
    r.readAsDataURL(blob);
  });
}

/* =====================================================================
   THE PAPER
   ===================================================================== */
let user = null;
let paperId = new URLSearchParams(location.search).get('p') || '';
let paper = null;
let mode = 'clean';
let cleaning = false;
let cleanFail = 0;          // figures the model would not clean, this visit

const isAdmin = u => !!u && ADMIN_EMAILS.includes((u.email || '').toLowerCase());
const expired = p => { const t = Date.parse(p && p.expiresAt); return isFinite(t) && t < Date.now(); };

function gate(html, btns) {
  $('gate').classList.remove('hidden');
  $('paperWrap').classList.add('hidden');
  $('gateText').innerHTML = html;
  $('gateBtns').innerHTML = btns || '';
}

async function open() {
  if (!paperId) {
    gate('This link is missing its worksheet. Open the link from your email again — it should end in <code>?p=…</code>.');
    return;
  }
  if (!user) {
    gate('Sign in with the same account you scanned your paper with, and your worksheet opens here.',
      '<button class="btn primary" onclick="window.__signIn()">Sign in with Google</button>');
    return;
  }
  gate('Opening your worksheet…');
  let snap;
  try { snap = await getDoc(doc(db, PAPER_COL, paperId)); }
  catch (e) {
    console.warn(e);
    gate('This worksheet could not be opened — you may be signed in with a different account from the one it was made on.');
    return;
  }
  if (!snap.exists()) { gate('This worksheet is no longer here. Make a new one from your mistake book in the Scan app.'); return; }
  const p = snap.data();
  // It is the student's own marked work, so the link alone is not enough:
  // only the account it was made on, or their teacher, can read it.
  if (p.owner !== user.uid && !isAdmin(user)) {
    gate('This worksheet belongs to somebody else. Sign in with the account it was made on.');
    return;
  }
  if (expired(p)) { gate('This worksheet has expired. Make a new one from your mistake book in the Scan app.'); return; }
  paper = p;
  mode = (p.mode === 'original') ? 'original' : 'clean';
  $('gate').classList.add('hidden');
  $('paperWrap').classList.remove('hidden');
  render();
  if (mode === 'clean') cleanAll();
}

/* ---- Rendering ----
   ONE renderer for both versions: the wording, the options and the answers
   are identical, and only the picture is chosen by the mode. Two renderers
   would be two things to keep in step, and the version a student is looking
   at would eventually stop being the version they chose. */
function figureFor(it) {
  if (!it.img) return '';
  const clean = mode === 'clean' && it.cleanImg;
  const src = clean ? it.cleanImg : it.img;
  const note = mode === 'clean' && !it.cleanImg
    ? (cleaning ? 'cleaning this up…' : 'shown as photographed — this one could not be cleaned up')
    : '';
  return '<div class="qFig"><img src="' + esc(src) + '" alt="The figure for question ' + it.n + '">' +
    (note ? '<div class="figNote">' + esc(note) + '</div>' : '') + '</div>';
}
function questionHtml(it) {
  const opts = (it.options || []).length
    ? '<ul class="qOpts">' + it.options.map(o =>
        '<li>(' + esc(o.label) + ')&nbsp; ' + esc(o.text) + '</li>').join('') + '</ul>'
    : '';
  const mcq = (it.options || []).length > 0;
  return '<div class="q">' +
    '<div class="qHead"><span class="qNum">' + it.n + '.</span>' +
      (it.number ? '<span class="qMeta">was question ' + esc(it.number) + '</span>' : '') + '</div>' +
    '<div class="qText">' + esc(it.question) + '</div>' +
    figureFor(it) + opts +
    (mcq ? '<div class="qLine">Answer: <b>&nbsp;</b></div>'
         : '<div class="qWork"></div><div class="qLine">Answer: <b>&nbsp;</b></div>') +
  '</div>';
}
function keyHtml(it) {
  return '<div class="keyRow">' +
    '<div class="keyNum">' + it.n + '.</div>' +
    (it.answer ? '<div class="keyAns"><b>Answer:</b> ' + esc(it.answer) + '</div>' : '') +
    (it.explanation ? '<div class="keyWhy">' + esc(it.explanation) + '</div>' : '') +
    (it.studentAnswer ? '<div class="keyYou">Last time you wrote: ' + esc(it.studentAnswer) +
      (it.feedback ? ' — ' + esc(it.feedback) : '') + '</div>' : '') +
  '</div>';
}
/* ---- One run per subject ----
   The Scan app writes the questions subject by subject, so a run is a run of
   consecutive items and this only has to notice where one ends. It heads them
   ONLY on a paper that holds more than one: a heading over the whole of a
   maths sheet is noise, and the title already says what it is.

   A question whose subject was never read is not given one here. Guessing it
   from the wording would put a heading on the page that nobody chose, which
   is exactly what "P6 Science corrections" over a maths question already
   cost. Its run is headed "Other questions" instead. */
function paperSubjects(items) {
  const seen = [];
  (items || []).forEach(i => { const v = i.subject || ''; if (seen.indexOf(v) === -1) seen.push(v); });
  return seen;
}
function subjectRunsHtml(items, rowHtml) {
  const list = items || [];
  const many = paperSubjects(list).length > 1;
  let out = '', last = null;
  list.forEach((it, i) => {
    const subj = it.subject || '';
    if (many && subj !== last) {
      /* The RUN, counted from here — not every question of that subject on
         the sheet. A paper written before the Scan app ordered them can come
         back interleaved, and "Mathematics · 4 questions" over a run of one
         is a heading that contradicts the page under it. */
      let run = 0;
      while (i + run < list.length && ((list[i + run].subject || '') === subj)) run++;
      out += '<div class="shSubj">' + esc(subjectLabel(subj) || 'Other questions') +
        ' <span class="shSubjSub">· ' + run + ' question' + (run === 1 ? '' : 's') + '</span></div>';
      last = subj;
    }
    out += rowHtml(it);
  });
  return out;
}

function render() {
  if (!paper) return;
  const items = paper.items || [];
  $('pTitle').textContent = paper.title || 'Try again';
  const subs = paperSubjects(items).filter(Boolean);
  $('pSub').textContent = items.length + ' question' + (items.length === 1 ? '' : 's') +
    ' you got wrong, to try again' +
    (subs.length > 1 ? ' — ' + subs.map(subjectLabel).join(' and ') : '') +
    '. The answers are on the last page.';
  $('modeClean').classList.toggle('on', mode === 'clean');
  $('modeOriginal').classList.toggle('on', mode === 'original');
  $('modeNote').textContent = mode === 'clean'
    ? 'The printing has been sharpened and your own working rubbed out, so the question is blank again. ' +
      'The wording is exactly what was read off your paper — only the pictures are redrawn, so check a figure ' +
      'against the original if anything looks odd.'
    : 'Every picture exactly as it was photographed, your own working and all.';

  const withFigs = items.filter(i => i.img).length;
  $('sheet').innerHTML =
    '<div class="sheet">' +
      '<div class="shHead">' +
        '<div class="shTitle">' + esc(paper.title || 'Try again') + '</div>' +
        '<div class="shOrg">Polymath Learning Centre · questions to try again</div>' +
      '</div>' +
      '<div class="shName"><span>Name:&nbsp;</span><span>Date:&nbsp;</span></div>' +
      '<div class="shHow">When you have finished, <b>photograph this back into the Scan app</b> to have it ' +
        'marked. Get a question right <b>twice in a row</b> and it comes out of your mistake book.</div>' +
      subjectRunsHtml(items, questionHtml) +
    '</div>' +
    '<div class="sheet keyPage">' +
      '<div class="shHead"><div class="shTitle">Answers</div>' +
      '<div class="shOrg">' + esc(paper.title || '') + '</div></div>' +
      '<div style="margin-top:14px">' + subjectRunsHtml(items, keyHtml) + '</div>' +
    '</div>';
  if (!withFigs) { /* nothing to clean — the mode still changes nothing else */ }
}

/* ---- Cleaning them, once ----
   Done here rather than in the Scan app because this is where the image model
   is, and done LAZILY rather than at send time so a paper nobody opens costs
   nothing. The result is written back onto the paper, so it is paid for once
   and every later visit — and the teacher's visit — is instant.

   One at a time on purpose: these are big calls, they are being made on a
   student's phone, and a row of them in parallel is how a page stalls. */
async function cleanAll() {
  if (cleaning || !paper) return;
  const todo = (paper.items || []).filter(i => i.img && !i.cleanImg);
  if (!todo.length) return;
  if (!imageAiReady()) {
    cleanFail = todo.length;
    $('modeNote').textContent = 'The clean-up is not available on this device, so the pictures are shown as ' +
      'photographed. Everything else on the sheet is unchanged.';
    return;
  }
  cleaning = true;
  $('prog').classList.add('on');
  let done = 0, failed = 0;
  const step = () => {
    $('progFill').style.width = Math.round(done / todo.length * 100) + '%';
    $('progText').textContent = 'Cleaning up picture ' + Math.min(done + 1, todo.length) + ' of ' + todo.length + '…';
  };
  step();
  for (const it of todo) {
    try {
      const src = await urlToDataUrl(it.img);
      const out = await cleanFigure(src);
      let url = out;
      // Keep it, so this is paid for once. A Storage or rules refusal is not
      // a failure of the clean-up — the picture is already in hand and is
      // shown; it will simply be made again on the next visit.
      try {
        const ref = sRef(storage, IMG_PATH + '/' + paper.owner + '/clean_' + paperId + '_' + it.n + '.png');
        await uploadString(ref, out, 'data_url');
        url = await getDownloadURL(ref);
      } catch (e) { console.warn('cleaned picture could not be kept', e); }
      it.cleanImg = url;
      try { await updateDoc(doc(db, PAPER_COL, paperId), { items: paper.items }); }
      catch (e) { console.warn('paper could not be updated', e); }
    } catch (e) {
      console.warn('figure ' + it.n + ' could not be cleaned', e);
      failed++;
    }
    done++;
    step();
    render();
  }
  cleaning = false;
  cleanFail = failed;
  $('prog').classList.remove('on');
  render();
  if (failed) {
    $('modeNote').textContent = failed + ' picture' + (failed === 1 ? '' : 's') +
      ' could not be cleaned up and ' + (failed === 1 ? 'is' : 'are') + ' shown as photographed. ' +
      'Everything else on the sheet is unchanged.';
  }
}

/* ---- Wiring ---- */
$('modeClean').addEventListener('click', () => { mode = 'clean'; render(); cleanAll(); });
$('modeOriginal').addEventListener('click', () => { mode = 'original'; render(); });
$('printBtn').addEventListener('click', () => window.print());
$('signInBtn').addEventListener('click', () => window.__signIn());
$('signOutBtn').addEventListener('click', () => signOut(auth));

window.__signIn = () => {
  const provider = new GoogleAuthProvider();
  signInWithPopup(auth, provider).catch(e => {
    if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) {
      signInWithRedirect(auth, provider);
      return;
    }
    if (e && e.code === 'auth/popup-closed-by-user') return;
    gate('Could not sign in: ' + esc((e && e.message) || e),
      '<button class="btn primary" onclick="window.__signIn()">Try again</button>');
  });
};

onAuthStateChanged(auth, u => {
  user = u || null;
  $('signInBtn').classList.toggle('hidden', !!user);
  $('signOutBtn').classList.toggle('hidden', !user);
  $('whoAmI').textContent = user ? (user.displayName || user.email || '') : '';
  // A different account must never be left looking at the last one's paper.
  paper = null;
  open();
});
</script>
